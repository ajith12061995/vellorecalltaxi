apply plugin: 'com.android.application'

android {
    // shared 2-tap login plugin (mobile/shared/vctauth), the same source in the customer and the driver app
    sourceSets { main.java.srcDirs += ['../../../shared/vctauth/java'] }
    namespace = "app.velloretaxi.driver"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.velloretaxi.driver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("VCT_VERSION_CODE") ?: "1")
        versionName(System.getenv("VCT_VERSION_NAME") ?: "1.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Upload key comes only from CI secrets (never stored in the repository). Without it the release build is unsigned.
    signingConfigs {
        release {
            if (System.getenv("VCT_KEYSTORE")) {
                storeFile file(System.getenv("VCT_KEYSTORE"))
                storePassword System.getenv("VCT_KEYSTORE_PASSWORD")
                keyAlias System.getenv("VCT_KEY_ALIAS")
                keyPassword System.getenv("VCT_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("VCT_KEYSTORE")) { signingConfig signingConfigs.release }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // 2-tap login (shared VctAuth plugin): phone number popup, native Firebase OTP + SMS auto-read, Play Integrity App Check
    implementation platform('com.google.firebase:firebase-bom:34.0.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.google.android.gms:play-services-auth-api-phone:18.1.0'   // SMS User Consent (OTP)
    implementation 'com.google.android.play:app-update:2.1.0'   // in-app update screen when a newer version is on Google Play
    implementation 'com.google.android.gms:play-services-location:21.3.0'         // NativeLive: position while the app is not on screen
    implementation "com.google.firebase:firebase-messaging:${project.hasProperty('firebaseMessagingVersion') ? rootProject.ext.firebaseMessagingVersion : '25.0.1'}"   // VctMessagingService (same version as the push plugin)
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
