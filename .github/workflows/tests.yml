name: tests
# Security-rules tests on the Firestore emulator + unit tests. Runs on the ci-tests branch and by hand.
on:
  push:
    branches: [ci-tests]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Unit tests (fare, geo)
        run: for f in tests/unit/*.test.js; do node "$f"; done
      - name: Weather source check (real request to MET Norway; informative, does not fail the run)
        continue-on-error: true
        run: node -e "const W=require('./functions/lib/weather');W.get(fetch,'').then(r=>{console.log('status',r.status,'last-modified',r.lastMod);const s=W.summary(r.data,Date.now());console.log('summary',JSON.stringify(s));if(!s)process.exit(1)})"
      - name: Security rules tests (Firestore emulator)
        working-directory: tests/rules
        run: npm install --no-audit --no-fund && npm test
      - name: Cloud Functions tests
        if: hashFiles('functions/package.json') != ''
        working-directory: functions
        run: npm install --no-audit --no-fund && npm test
      - name: Cloud Functions integration (real functions in the emulators)
        timeout-minutes: 12
        run: |
          (cd functions && npm install --no-audit --no-fund)
          printf 'FN_REGION=asia-south1\nBACKUP_BUCKET=emulator-none\n' > functions/.env.demo-vct
          cd tests/fnint && npm install --no-audit --no-fund && npm test
