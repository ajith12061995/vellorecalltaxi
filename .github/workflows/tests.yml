name: tests
# Security-rules tests on the Firestore emulator + unit tests. Runs on the ci-tests branch and by hand.
on:
  push:
    branches: [ci-tests]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Unit tests (fare, geo)
        run: for f in tests/unit/*.test.js; do node "$f"; done
      - name: Security rules tests (Firestore emulator)
        working-directory: tests/rules
        run: npm install --no-audit --no-fund && npm test
      - name: Cloud Functions tests
        if: hashFiles('functions/package.json') != ''
        working-directory: functions
        run: npm install --no-audit --no-fund && npm test
      - name: Cloud Functions integration (real functions in the emulators)
        timeout-minutes: 12
        run: |
          (cd functions && npm install --no-audit --no-fund)
          printf 'FN_REGION=asia-south1\nBACKUP_BUCKET=emulator-none\n' > functions/.env.demo-vct
          # dummy WhatsApp secrets for the emulator (real ones live only in Google Secret Manager)
          printf 'WA_TOKEN=ci-dummy\nWA_APP_SECRET=ci-dummy\nWA_VERIFY_TOKEN=ci-dummy\n' > functions/.secret.local
          cd tests/fnint && npm install --no-audit --no-fund && npm test
