name: android-shot
# Opens the real customer app (debug build, same config as the Play Store app → https://velloretaxi.app/) on an
# emulator and saves screenshots + the page width the WebView uses. Runs on pushes to android-shot-test and by hand.
on:
  push:
    branches: [android-shot-test]
  workflow_dispatch:
jobs:
  shot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 34]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Build debug customer app (production config)
        working-directory: mobile/customer
        run: |
          node -e "const f='capacitor.config.json',j=require('./'+f);j.android.webContentsDebuggingEnabled=true;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          npm ci --no-audit --no-fund && npx cap sync android
          cd android && chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/android/shot.sh mobile/customer/android/app/build/outputs/apk/debug/app-debug.apk shots-${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots-${{ matrix.api }}
          path: shots-${{ matrix.api }}
