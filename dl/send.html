<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>VCT app bundle</title>
<p id="s">Sending…</p>
<script>
/* Helper for uploading the signed Android bundle into Google Play Console: embedded by the Play Console tab,
   it fetches the public .aab from branch aab-dl and posts it to that tab (only to the Play Console origin). */
(async()=>{const s=document.getElementById('s');
  try{const app=new URLSearchParams(location.search).get('app')==='driver'?'driver':'customer';
    const tgt=window.parent!==window?window.parent:window.opener;if(!tgt)throw new Error('no parent');
    const base='https://raw.githubusercontent.com/ajith12061995/vellorecalltaxi/aab-dl/';
    const v=(await (await fetch(base+'version.txt',{cache:'no-store'})).text()).trim();
    const r=await fetch(base+app+'.aab',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);
    const f=new File([await r.blob()],'vct-'+app+'-'+v+'.aab',{type:'application/octet-stream'});
    tgt.postMessage({vctAab:f,version:v},'https://play.google.com');s.textContent='Sent '+f.name+' ('+f.size+' bytes)'}catch(e){s.textContent='Error: '+e.message}})();
</script>
