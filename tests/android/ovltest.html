<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Overlay test</title><body style="font:20px sans-serif;padding:20px">
<div id="st">overlay test…</div>
<script>
// CI test page for the Android RideOverlay plugin (tests/android/ovl-emulator.sh). It behaves like the driver page:
// tells the plugin "online", and 12 s later (the script has put the app in the background by then) asks it to ring.
// A 1-second ticker is reported too, so the log shows whether this page keeps running while the app is in the background.
const st=document.getElementById('st');const rep=(k,v)=>fetch('/report?'+k+'='+encodeURIComponent(v)).catch(()=>{});
const C=window.Capacitor,call=(m,o)=>C.nativePromise('RideOverlay',m,o||{});
let n=0;setInterval(()=>{n++;if(n%3===0)rep('tick',n+':'+document.visibilityState)},1000);
// boot = how many times this page has started (the app is reopened by DutyService after being swiped away / killed)
let boot=1;try{boot=(+localStorage.getItem('boot')||0)+1;localStorage.setItem('boot',boot)}catch(e){}
(async()=>{
  try{rep('boot',boot);const s=await call('status');rep('status',JSON.stringify(s));
    await call('online',{on:true});rep('online','sent');
    setTimeout(()=>call('ready').then(()=>rep('ready','sent:'+boot)).catch(e=>rep('ready','ERR '+e)),2000);
    if(!localStorage.getItem('rung'))setTimeout(async()=>{localStorage.setItem('rung','1');try{await call('ring',{id:'ride42',title:'New ride!',line1:'Katpadi Junction → CMC Hospital',line2:'Pickup 1.2 km · trip 4.8 km',fare:'₹130',accept:'Accept',open:'View',secs:40,
      veh:'Sedan',pay:'Cash',pkm:'0.8 km',pname:'Katpadi Junction',psub:'Chittoor Bus Stand, Katpadi',dkm:'4.3 km',dname:'CMC Hospital',dsub:'Ida Scudder Road, Vellore',extra:'incl. ₹10 tip'});rep('ring','sent:'+document.visibilityState)}catch(e){rep('ring','ERR '+e)}},12000);
  }catch(e){rep('status','ERR '+e)}
})();
// the test script drives the page by writing a command into tests/android/cmd.txt: "off", or "<n>:<command>" (1.0.17 tests)
let offDone=false,lastCmd='';setInterval(()=>{fetch('/tests/android/cmd.txt?'+Date.now()).then(r=>r.ok?r.text():'').then(t=>{t=t.trim();
  if(t==='off'&&!offDone){offDone=true;call('online',{on:false}).then(()=>rep('off','sent')).catch(e=>rep('off','ERR '+e));return}
  if(!t.includes(':')||t===lastCmd)return;lastCmd=t;const c=t.split(':')[1];
  if(c==='on'){offDone=false;call('online',{on:true}).then(()=>rep('on2','sent')).catch(e=>rep('on2','ERR '+e))}
  if(c.startsWith('taken-'))call('testPush',{data:{type:'taken',bookingId:c.slice(6)},delay:0}).then(()=>rep('taken','sent'));
  if(c==='tok')call('testToken',{token:'tok-native-1'}).then(()=>rep('tok','sent')).catch(e=>rep('tok','ERR '+e));
  if(c==='live')call('liveStart',{apiKey:'key-test',project:'proj-test',phone:'+919999900002',refresh:'rt-test',veh:'mini',tokenBase:'http://10.0.2.2:8080/fake',fsBase:'http://10.0.2.2:8080/fake'}).then(()=>rep('live','sent')).catch(e=>rep('live','ERR '+e));
  if(c==='livestatus')call('liveStatus').then(r=>rep('livestatus',JSON.stringify(r))).catch(e=>rep('livestatus','ERR '+e));
  if(c==='shutdown')call('testShutdown').then(()=>rep('shutdown','sent')).catch(e=>rep('shutdown','ERR '+e));
  if(c==='voice')call('voice').then(r=>rep('voice',JSON.stringify(r))).catch(e=>rep('voice','ERR '+e));
  if(c==='fsi')call('fsi').then(r=>rep('fsi',JSON.stringify(r))).catch(e=>rep('fsi','ERR '+e));
  if(c.startsWith('push'))call('testPush',{data:{type:'ride',bookingId:c,veh:'mini',kind:'ride',fare:'150',tip:'0',from:'Katpadi Junction',to:'CMC Hospital',flat:'12.98',flon:'79.165',when:String(Date.now())},delay:12000}).then(()=>rep('push','sent:'+c)).catch(e=>rep('push','ERR '+e));
}).catch(()=>{})},1500);
// 1.0.17: a server push wakes the page ("wake"); like the driver page, it then rings for that ride
window.addEventListener('vctwake',e=>{let d={};try{d=JSON.parse(e.vct||'{}')}catch(x){};rep('wake',(d&&d.bookingId)||'?');if(/deaf|gone|far/.test((d&&d.bookingId)||'')||(d&&d.type==='taken'))return;call('ring',{id:(d&&d.bookingId)||'r',title:'New ride!',fare:'₹150',accept:'Accept',open:'Later',secs:40,
  veh:'Mini',pay:'Cash',pkm:'1.1 km',pname:'Katpadi Junction',psub:'Katpadi',dkm:'5.0 km',dname:'CMC Hospital',dsub:'Vellore',
  say:'புது சவாரி. காட்பாடி ஜங்ஷன். 1.1 கிலோமீட்டர் தூரம். 150 ரூபாய்.',sayEn:'New ride. Katpadi Junction. 1.1 kilometres away. 150 rupees.'}).then(()=>rep('ring2','sent:'+document.visibilityState)).catch(e=>rep('ring2','ERR '+e))});
document.addEventListener('visibilitychange',async()=>{rep('vis',document.visibilityState);
  if(document.visibilityState==='visible'){try{const t=await call('take');rep('take',JSON.stringify(t));st.textContent='TAKE:'+JSON.stringify(t);if(t&&t.action)await call('stop')}catch(e){rep('take','ERR '+e)}}});
</script>
