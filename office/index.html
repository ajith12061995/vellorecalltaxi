<body>
<title>Vellore Taxi Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&family=Hind+Madurai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width app column; map is the stage, a white bottom sheet carries the actions. */
:root{
  --yellow:#FFC21A; --yellow-soft:#FFF5C9; --yellow-ink:#7A5A00;
  --navy:#12664A; --navy-2:#2C5196; --navy-soft:#E6EDF9;
  --bg:#F5F7F2; --surface:#FFFFFF; --surface-2:#F7FAF8;
  --fg:#0B4A36; --muted:#5B6B64; --line:#E1E8E4;
  --map-land:#EDF1F7; --map-block:#E3E9F2; --map-road:#FFFFFF; --map-edge:#D3E2DA; --map-river:#CBE1F4; --map-label:#56657F; --map-bldg:#D6DEEA;
  --ok:#1E8A5A; --danger:#C23B3B;
  --shadow:0 10px 30px rgba(19,40,79,.12);
  --display:"Baloo Thambi 2","Hind Madurai",system-ui,sans-serif;
  --body:"Hind Madurai","Noto Sans Tamil",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --yellow:#FFC21A; --yellow-soft:#3A3417; --yellow-ink:#FFE38A;
  --navy:#7FD3A8; --navy-2:#A8D5C0; --navy-soft:#1B3129;
  --bg:#0A1712; --surface:#11231C; --surface-2:#183026; --fg:#E8F2EC; --muted:#9DB3A9; --line:#23392F;
  --map-land:#0E1D17; --map-block:#12241D; --map-road:#284236; --map-edge:#182E25; --map-river:#164032; --map-label:#8FA59B; --map-bldg:#1A3328;
  --ok:#4CC28C; --danger:#F07A7A; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --yellow:#FFC21A; --yellow-soft:#3A3417; --yellow-ink:#FFE38A;
  --navy:#7FD3A8; --navy-2:#A8D5C0; --navy-soft:#1B3129;
  --bg:#0A1712; --surface:#11231C; --surface-2:#183026; --fg:#E8F2EC; --muted:#9DB3A9; --line:#23392F;
  --map-land:#0E1D17; --map-block:#12241D; --map-road:#284236; --map-edge:#182E25; --map-river:#164032; --map-label:#8FA59B; --map-bldg:#1A3328;
  --ok:#4CC28C; --danger:#F07A7A; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--surface);overflow:hidden}
@media (min-width:520px){.app{height:calc(100% - 32px);margin-block:16px;border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);animation:in .32s ease both}
@keyframes in{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;transition:transform .12s, opacity .2s}
:root[data-theme="dark"] .btn{color:#0A1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0A1712}}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.yellow{background:var(--yellow);color:#0B4A36}

/* splash */
#splash{background:#0B4A36;color:#fff;align-items:center;justify-content:center;gap:22px}
.roofsign{background:var(--yellow);color:#0B4A36;border-radius:14px 14px 6px 6px;padding:14px 22px 10px;text-align:center;box-shadow:0 14px 0 -6px #0b1a36, 0 0 0 4px rgba(255,216,77,.25);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.roofsign b{display:block;font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.06em}
.roofsign span{font-family:var(--display);font-size:17px;font-weight:600}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.road{width:220px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#FFC21A 0 26px,transparent 26px 44px);background-size:44px 6px;animation:roll .6s linear infinite;opacity:.8}
@keyframes roll{to{background-position:-44px 0}}
.tag{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}

/* onboarding */
.hero{background:linear-gradient(170deg,var(--yellow) 0%,var(--yellow-soft) 100%);padding-top:48px;padding-bottom:28px;display:flex;flex-direction:column;gap:10px;border-radius:0 0 32px 32px}
.hero h1{font-size:30px;color:#0B4A36}
.hero p{margin:0;color:#3D4D6E}
.hero .mini{display:inline-flex;align-self:flex-start;background:#0B4A36;color:var(--yellow);font-family:var(--display);font-weight:700;padding:4px 12px;border-radius:999px;font-size:13px;letter-spacing:.06em}
.body{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:24px;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));overflow:auto}
.langcard{display:flex;align-items:center;justify-content:space-between;padding:18px;border:2px solid var(--line);border-radius:18px;text-align:left;background:var(--surface)}
.langcard.sel{border-color:var(--navy);background:var(--navy-soft)}
.langcard b{font-family:var(--display);font-size:22px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.sel .radio{border:7px solid var(--navy)}
.field{display:flex;align-items:center;gap:10px;height:58px;border:2px solid var(--line);border-radius:16px;padding:0 16px;background:var(--surface)}
.field:focus-within{border-color:var(--navy)}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:19px;color:var(--fg);letter-spacing:.04em}
.field .cc{font-weight:700;padding-right:10px;border-right:1px solid var(--line)}
.otp{display:flex;gap:12px}
.otp input{width:100%;min-width:0;height:62px;text-align:center;font-size:26px;font-family:var(--display);font-weight:700;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--fg)}
.otp input:focus{border-color:var(--navy);outline:0}
.note{background:var(--yellow-soft);color:var(--yellow-ink);border-radius:14px;padding:10px 14px;font-size:13.5px}
.err{color:var(--danger);font-size:13.5px;min-height:18px}
.linkbtn{color:var(--navy);font-weight:700;font-size:14px}
.fine{font-size:12.5px;text-align:center}

/* home */
.mapwrap{position:relative;flex:1 1 auto;min-height:230px}
canvas.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.topbar{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;z-index:2}
.chipbtn{height:42px;min-width:42px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:700;font-size:13.5px}
.greet{flex:1;min-width:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:6px 12px;line-height:1.2}
.greet small{display:block;color:var(--muted);font-size:12px}
.greet b{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.locate{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:30px;z-index:2}
.nearby{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:30px;z-index:2;background:var(--navy);color:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
:root[data-theme="dark"] .nearby{color:#0A1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nearby{color:#0A1712}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 0 rgba(255,216,77,.7);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(255,216,77,0)}100%{box-shadow:0 0 0 0 rgba(255,216,77,0)}}
.sheet{position:relative;z-index:3;margin-top:-22px;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -8px 24px rgba(19,40,79,.08);display:flex;flex-direction:column;gap:16px;padding-top:12px;padding-bottom:14px;max-height:62%;overflow:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.where{display:flex;align-items:center;gap:12px;height:58px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);padding:0 8px 0 16px;text-align:left;width:100%}
.where span{flex:1;font-family:var(--display);font-weight:700;font-size:19px}
.where i{width:42px;height:42px;border-radius:13px;background:var(--yellow);display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;white-space:nowrap}
.sec{display:flex;align-items:baseline;justify-content:space-between}
.sec h3{font-size:17px}
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.svc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.svc i{width:100%;aspect-ratio:1;max-width:72px;border-radius:18px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center}
.svc:first-child i{background:var(--yellow)}
.offers{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.offers::-webkit-scrollbar{display:none}
.offer{flex:none;width:78%;scroll-snap-align:start;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-height:120px}
.offer b{font-family:var(--display);font-size:20px;line-height:1.15}
.offer small{opacity:.85;font-size:12.5px}
.offer .code{align-self:flex-start;margin-top:auto;border:1.5px dashed currentColor;border-radius:8px;padding:2px 10px;font-weight:700;letter-spacing:.08em;font-size:13px}
.offer.o1{background:#0B4A36;color:#FFC21A}
.offer.o2{background:#FFC21A;color:#0B4A36}
.offer.o3{background:#2C5196;color:#fff}
.offer svg{position:absolute;right:-14px;bottom:-12px;opacity:.18}
.sample{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.recent{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.row div{flex:1;min-width:0}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--muted);font-size:12.5px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:max(6px,env(safe-area-inset-bottom,0px));position:relative;z-index:4}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--navy)}
.nav button.on svg{background:var(--yellow-soft);border-radius:10px}
.nav svg{width:44px;height:28px;padding:3px 10px}

/* search */
.head{display:flex;align-items:center;gap:10px;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:10px}
.head h2{font-size:20px;flex:1}
.back{width:42px;height:42px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.route-in{display:flex;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.rail{display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:0}
.rail .a{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.rail .l{width:2px;flex:1;min-height:28px;background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 6px)}
.rail .b{width:10px;height:10px;border-radius:2px;background:var(--danger)}
.ins{flex:1;min-width:0;display:flex;flex-direction:column}
.ins input{height:44px;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--fg);min-width:0}
.ins input:first-child{border-bottom:1px solid var(--line)}
.ins input:focus{color:var(--navy)}
.mic{width:44px;height:44px;border-radius:14px;background:var(--yellow);display:flex;align-items:center;justify-content:center;align-self:flex-end;flex:none}
.list{flex:1;overflow:auto;padding-bottom:20px}
.tagline{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 0 4px}

/* fare */
.fare-sheet{gap:12px;max-height:68%}
.trip{display:flex;gap:10px;align-items:center;font-size:13.5px}
.trip b{font-family:var(--display);font-size:16px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--navy-soft);color:var(--navy);border-radius:999px;padding:3px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.veh{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:2px solid var(--line);text-align:left;width:100%;background:var(--surface);transition:border-color .15s, background .15s}
.veh.sel{border-color:var(--navy);background:var(--navy-soft)}
.veh .vi{width:58px;height:44px;border-radius:12px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;flex:none}
.veh div{flex:1;min-width:0}
.veh b{font-family:var(--display);font-size:17px;display:block}
.veh small{color:var(--muted);font-size:12.5px}
.veh .price{text-align:right;flex:none}
.veh .price b{font-size:20px;font-variant-numeric:tabular-nums}
.veh .price s{color:var(--muted);font-size:12px}
.payrow{display:flex;gap:8px}
.pay{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.pay.sel{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}


canvas.map{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
canvas.map:active{cursor:grabbing}
.zoomctl{position:absolute;right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;z-index:2}
.zoomctl .chipbtn{font-size:22px;font-weight:700;width:44px;height:44px;padding:0}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(14px,env(safe-area-inset-top,0px)) + 56px);z-index:2;background:rgba(19,40,79,.88);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint.gone{opacity:0}
.pin{position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;transform:translate(-50%,-97%);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.pin.lift{transform:translate(-50%,calc(-97% - 16px))}
.pinshadow{position:absolute;left:50%;top:50%;width:18px;height:7px;border-radius:50%;background:rgba(19,40,79,.4);transform:translate(-50%,-50%);z-index:2;pointer-events:none;transition:.2s}
.pin.lift + .pinshadow{width:10px;opacity:.45}
.pickcard{display:flex;flex-direction:column;gap:12px;padding-top:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);border-radius:24px 24px 0 0;margin-top:-20px;position:relative;z-index:4;box-shadow:0 -8px 24px rgba(19,40,79,.08)}
.addr{display:flex;gap:12px;align-items:flex-start;min-height:52px}

function simStep(){
  let changed=false;
  DB.bk.forEach(b=>{
    if(b.status==='assigned'){b.prog=Math.min(1,(b.prog||0)+.035);const d=drvById(b.driver);if(d){const p=P[b.from];d.lat+=(p.lat-d.lat)*.08;d.lon+=(p.lon-d.lon)*.08}
      if(b.prog>=1){b.status='ontrip';b.prog=0;if(d)d.status='trip';log(`${b.id} பயணம் ஆரம்பம் (PIN சரி)`,`${b.id} trip started (PIN verified)`);changed=true}}
    else if(b.status==='ontrip'){b.prog=Math.min(1,(b.prog||0)+.025);const d=drvById(b.driver);
      if(d){const pts=route(b.from,b.to).path.map(k=>P[k]),q=along(pts,b.prog);d.lat=q.lat;d.lon=q.lon}
      if(b.prog>=1){b.status='done';b.done=Date.now();if(d){d.status='avail';const c=Math.round(b.fare*DB.cfg.comm/100);d.wallet-=c}
        log(`${b.id} முடிஞ்சது · ${inr(b.fare)} (${b.pay})`,`${b.id} completed · ${inr(b.fare)} (${b.pay})`);changed=true}}
  });
  if(changed)saveDB();
  return changed;
}

  let bar=document.getElementById('ringbar');
  if(sos.length){if(!bar){bar=document.createElement('div');bar.id='ringbar';document.body.appendChild(bar)}
    bar.className='sos';bar.innerHTML=`<span class="bell">🆘</span><b>SOS · ${esc(sos[0].cust)}</b><small>${esc(sos[0].phone?'+91 '+String(sos[0].phone).replace('+91',''):'')}${sos.length>1?' · +'+(sos.length-1):''}</small>${sos[0].lat?`<a href="https://www.google.com/maps?q=${sos[0].lat},${sos[0].lon}" target="_blank" rel="noopener"><button>${L('இடம்','Location')}</button></a>`:''}${sos[0].phone?`<a href="tel:+91${String(sos[0].phone).replace('+91','')}"><button>📞</button></a>`:''}<button id="rgo">${L('பார்','Open')}</button>`;
    bar.querySelector('#rgo').onclick=()=>{S.sec='sup';save();show()};
    if(RTITLE===null)RTITLE=document.title;document.title=(Math.floor(now/1000)%2?'🆘 ':'')+'SOS · '+RTITLE;
    if(now-RLAST>1600){if(ringTone())RLAST=now}return}
  if(!list.length){if(bar)bar.remove();if(RTITLE!==null){document.title=RTITLE;RTITLE=null}return}
  if(!bar){bar=document.createElement('div');bar.id='ringbar';document.body.appendChild(bar)}
  const muted=now<RSNOOZE,ok=RAC&&RAC.state==='running';
  bar.className=muted?'mute':'';
  bar.innerHTML=`<span class="bell">🔔</span><b>${L(`${list.length} booking உங்க பதிலுக்கு காத்திருக்கு`,`${list.length} booking${list.length>1?'s':''} waiting for you`)}</b><small>${esc(list.map(b=>`${billDesk(b)?'💰 '+L(`Bill அதிகம் ${inr(b.fareQ)} → ${inr(b.fare)}`,`High bill ${inr(b.fareQ)} → ${inr(b.fare)}`):b.reason==='nodriver'?'📞 '+L('Driver கிடைக்கல — customer-ஐ அழைங்க','No driver — call the customer'):schedDesk(b)?'⏰ '+L(`${Math.max(0,Math.round((b.when-Date.now())/6e4))} நிமி-ல pickup, driver இல்லை`,`pickup in ${Math.max(0,Math.round((b.when-Date.now())/6e4))} min, no driver`):b.status==='cancelled'?'🔁 '+L('Driver ரத்து','Driver cancelled'):b.kind==='outstation'?'🛣️':b.kind==='rental'?'⏱️':'🚕 '+L('யாரும் எடுக்கல','no taker')} ${b.id} · ${pn(b.to)}`).join(' · '))}</small>
    ${ok?'':`<em>${L('ஒலி வர இங்கே ஒரு தடவை click பண்ணுங்க','Click once here to turn on sound')}</em>`}<button id="rgo">${L('பார்','Open')}</button><button id="rmu">${muted?L('ஒலி ON','Sound on'):L('1 நிமி அமைதி','Mute 1 min')}</button>`;
  bar.querySelector('#rgo').onclick=()=>{const b=list[0];S.sec='book';BT=billDesk(b)?'done':'live';save();show();setTimeout(()=>{billDesk(b)?bookSheet(b):b.reason==='nodriver'?noDrvSheet(b):b.status==='cancelled'?reopenSheet(b):b.dispatch&&b.dispatch.review?reviewSheet(b):assignSheet(b)},200)};
  bar.querySelector('#rmu').onclick=e=>{e.stopPropagation();RSNOOZE=muted?0:Date.now()+60e3;ringCheck()};
  if(RTITLE===null)RTITLE=document.title;document.title=(Math.floor(now/1000)%2?'🔔 ':'')+`(${list.length}) ${RTITLE}`;
  if(!muted&&now-RLAST>3200){if(ringTone())RLAST=now}
}
function liveRows(list){return list.length?list.map(b=>{const d=drvById(b.driver);return `<div class="lrow"><div><b>${kTag(b)}${b.id} · ${pn(b.from)} → ${pn(b.to)}</b><small>${vname(b.veh)} · ${d?d[S.lang]+' · '+d.plate:L('Driver இல்லை','No driver')} · ${b.status==='scheduled'||isFut(b)?'⏰ '+dt(b.when):ago(b.created)}</small>${cdHtml(b)}</div>${stPillB(b)}${b.dispatch&&b.dispatch.review&&b.status==='searching'?`<button class="btn sm yellow" data-rv="${b.id}">${L('சரிபார்','Review')}</button>`:''}${(b.status==='searching'||b.status==='scheduled'&&!b.driver)?`<button class="btn sm" data-as="${b.id}">${L('Assign','Assign')}</button>`:''}</div>`}).join(''):`<p class="muted" style="margin:0">${L('இப்போ live booking இல்லை','No live bookings right now')}</p>`}
function refreshDashLists(){

}

let BT='live';
function book(){
  const tabs=[['live',L('Live','Live')],['sched',L('முன்பதிவு','Scheduled')],['done',L('முடிந்தவை','Completed')],['cx',L('ரத்து','Cancelled')]];

     <span><b>${vname(b.veh)}</b><small>${d?d[S.lang]+' · '+d.plate:'—'}</small></span>

     <span>${stPillB(b)}</span>
     <span class="acts2">${b.dispatch&&b.dispatch.review&&b.status==='searching'?`<button class="btn sm yellow" data-rv="${b.id}">${L('சரிபார்','Review')}</button>`:''}${b.status==='scheduled'?`<button class="linkbtn" data-dn="${b.id}">${L('இப்போ அனுப்பு','Dispatch now')}</button>`:''}${(b.status==='searching'||b.status==='scheduled')?`<button class="btn sm" data-as="${b.id}">${b.driver?L('மாற்று','Reassign'):L('Assign','Assign')}</button>`:''}${['searching','scheduled','assigned'].includes(b.status)?`<button class="linkbtn" data-cx="${b.id}" style="color:var(--danger)">${L('ரத்து','Cancel')}</button>`:''}</span></div>`}).join('')

function nearest(veh,from,exclude){const pt=typeof from==='object'?from:P[from];if(!pt||pt.lat==null)return DB.drv.filter(d=>d.veh===veh&&d.status==='avail'&&!d.blocked&&d.id!==exclude).map(d=>({d,km:0}));return DB.drv.filter(d=>d.veh===veh&&d.status==='avail'&&!d.blocked&&d.id!==exclude).map(d=>({d,km:hav(d,pt)*1.3})).sort((a,b)=>a.km-b.km)}

function billSheet(b){if(!b||S.role!=='owner')return;const pass=b.fx&&b.fx.pass?+b.fx.pass:0,oldC=commOf(b);
  modal(`<h3>✏️ ${b.id} · ${L('Bill திருத்து','Correct the bill')}</h3>
    <p class="muted" style="margin:0;font-size:13px">${L('Customer கொடுத்த மொத்த தொகை (tip இல்லாம). Toll/parking','Total the customer paid (without tip). Toll/parking')} ${inr(pass)} ${L('commission-க்கு கணக்கில்லை.','is not charged commission.')}</p>
    <div class="field"><span class="cc">₹</span><input id="bnew" inputmode="numeric" maxlength="6" value="${b.fare}"></div>
    <input id="bwhy" placeholder="${L('காரணம் (கட்டாயம்)','Reason (required)')}" maxlength="120" style="height:44px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px">
    <div class="bill" id="bprev"></div><button class="btn" id="bok">${L('சேமி','Save')}</button>`,(m,close)=>{
    const nv=()=>Math.max(0,parseInt(m.querySelector('#bnew').value.replace(/\D/g,''))||0);
    const pv=()=>{const t=Math.max(0,nv()-pass),c=FARE.comm(t,DB.cfg.comm);m.querySelector('#bprev').innerHTML=`<div><span>Commission</span><b>${inr(oldC)} → ${inr(c)}</b></div><div><span>${L('Driver wallet மாற்றம்','Driver wallet change')}</span><b>${c<oldC?'+':'−'}${inr(Math.abs(oldC-c))}</b></div>`};
    m.querySelector('#bnew').oninput=pv;pv();
    m.querySelector('#bok').onclick=()=>{const why=m.querySelector('#bwhy').value.trim();if(!why){toast(L('காரணம் போடுங்க','Enter a reason'));return}
      const tot=nv(),t=Math.max(0,tot-pass),c=FARE.comm(t,DB.cfg.comm),delta=oldC-c;
      if(!CL){b.fare=tot;b.commA=c;saveDB();close();show();return}
      const bt=F().writeBatch(CL.db);bt.update(bkRef(b),{fareFinal:tot,comm:c,'fx.trip':t,billEdit:{by:CL.phone,why,at:Date.now(),from:b.fare},updatedAt:ts()});
      if(delta&&b.commA!=null&&b.driver)bt.update(F().doc(CL.db,'drivers',b.driver),{wallet:F().increment(delta),updatedAt:ts()});
      cw(bt.commit().then(()=>{close();toast(L('Bill திருத்தியாச்சு','Bill corrected'))}))}})}

    m.querySelector('#ro2').onclick=()=>{ackDesk(b._id);const go2=()=>{close();b.status='searching';b.driver=null;assignSheet(b)};if(CL){cw(F().updateDoc(bkRef(b),upd()).then(go2));return}go2()};
    m.querySelector('#ro3').onclick=()=>{ackDesk(b._id);if(CL){cw(F().updateDoc(bkRef(b),{cancelReason:'novehicle',updatedAt:ts()}).then(()=>{close();toast(L('Customer-க்கு மன்னிப்பு செய்தி போச்சு','Apology sent to the customer'))}));return}close()};

  });

function cancelSheet(bk){if(!bk)return;let rs='novehicle';
  const R=[['novehicle',L('வண்டி இல்லை','No vehicle available')],['customer',L('Customer கேட்டார்','Customer asked')],['office',L('மற்ற காரணம்','Other reason')]];

    <span class="kind">${L('காரணம்','Reason')}</span>${R.map(([k,l],i)=>`<button class="reason ${i===0?'sel':''}" data-rs="${k}"><i class="radio"></i>${l}</button>`).join('')}
    <div class="note" id="cxmsg"></div>
    <button class="btn ghost" id="y" style="color:var(--danger)">${L('ஆமா, ரத்து செய்','Yes, cancel')}</button><button class="btn" id="n">${L('வேண்டாம்','Keep it')}</button>`,(m,close)=>{
    const msg=()=>{m.querySelector('#cxmsg').innerHTML=rs==='novehicle'?`${L('Customer-க்கு போகும் செய்தி:','Message the customer gets:')}<br><b>${SORRY.ta}</b><br><b>${SORRY.en}</b>`:L('Customer-க்கும் driver-க்கும் "ரத்து" என்று தகவல் போகும்.','The customer and driver are told it was cancelled.')};msg();
    m.querySelectorAll('[data-rs]').forEach(x=>x.onclick=()=>{rs=x.dataset.rs;m.querySelectorAll('[data-rs]').forEach(y=>y.classList.toggle('sel',y===x));msg()});

      const d=drvById(bk.driver);if(d&&bk.status==='assigned')d.status='avail';bk.status='cancelled';bk.reason=rs;log(`${bk.id} ரத்து (office)`,`${bk.id} cancelled by office`);saveDB();close();show();toast(L('ரத்து ஆச்சு','Cancelled'))}});

async function loadHist(days){

function drvStats(d,hist){
  const mine=hist.filter(b=>b.driver===d.id),now=Date.now();

  const done=mine.filter(b=>b.status==='done'),cx=mine.filter(isDrvCx),rated=done.filter(b=>b.rating>0);
  const keys=new Set(mine.flatMap(b=>[b.id,b._id.slice(0,6).toUpperCase(),b._id]));
  const comp=DB.sup.filter(t=>t.type!=='callback'&&(keys.has(t.trip)||(t.phone&&t.phone.replace('+91','')===d.phone&&t.type!=='sos')));
  const avg=rated.length?rated.reduce((a,b)=>a+b.rating,0)/rated.length:0,taken=done.length+cx.length;

  if(taken>=5&&pct(cx.length,taken)>20)flags.push(L(`ரத்து ${pct(cx.length,taken)}%`,`Cancels ${pct(cx.length,taken)}%`));
  if(rated.length>=3&&avg<4)flags.push(L(`Rating ★${avg.toFixed(1)}`,`Rating ★${avg.toFixed(1)}`));
  const c7=comp.filter(t=>t.date>=now-7*DAY).length;if(c7>=2)flags.push(L(`வாரத்துல ${c7} புகார்`,`${c7} complaints this week`));
  return{mine,done,cx,rated,avg,comp,flags,d7:done.filter(in7),cxRate:pct(cx.length,taken),fares:done.reduce((a,b)=>a+b.fare,0),comm:Math.round(done.reduce((a,b)=>a+b.fare,0)*DB.cfg.comm/100)};
}

let CL=null,OUNS=[],LIVE={},RAWB=[],RAWBL=[],RAWBA=[],RAWD=[],RAWR=[],RAWRP=[],RAWT=[],RTIMER=null,SEEN=null;
const ON_PAGES=!/^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
const cloudP=(window.CLOUD_READY||Promise.resolve(null)).then(c=>{CL=c||null;return CL}).catch(()=>null);
const F=()=>CL.fs;const ts=()=>F().serverTimestamp();
const shortB=id=>'B'+id.slice(0,5).toUpperCase();
const placeK=k=>({key:k,ta:P[k].ta,en:P[k].en,lat:P[k].lat,lon:P[k].lon});
function cardScreen(h,p,btn,fn){app.innerHTML=`<section class="ologin"><div class="lcard"><div class="brand"><img src="./icon-192.png?v=8" alt="" style="width:40px;height:40px;border-radius:10px;flex:none" onerror="this.style.visibility='hidden'"><div><b>Vellore Taxi</b><small>Owner / Staff panel</small></div></div><h1>${h}</h1><p class="muted" style="margin:0">${p}</p><button class="btn" id="cb">${btn}</button></div></section>`;document.getElementById('cb').onclick=fn}
async function cloudBootO(){
  const c=await cloudP;
  if(!c){if(ON_PAGES){cardScreen(L('Internet இல்லை','You are offline'),L('Connection-ஐ பார்த்துட்டு மறுபடி முயற்சி பண்ணுங்க.','Check your connection and try again.'),L('மறுபடி முயற்சி','Try again'),()=>location.reload());return true}return false}
  const u=await CL.waitUser();
  if(!u||!u.phoneNumber){login();return true}
  await enterCloud();return true;
}
async function enterCloud(){
  let s=null;try{s=await F().getDoc(F().doc(CL.db,'staff',CL.phone))}catch(e){}
  if(!s||!s.exists()){cardScreen(L('அனுமதி இல்லை','No access'),L(`${CL.phone} இந்த panel-க்கு சேர்க்கப்படல. Owner-கிட்ட Settings → Staff-ல சேர்க்க சொல்லுங்க.`,`${CL.phone} is not added to this panel. Ask the owner to add you under Settings → Staff.`),L('வேற நம்பர்ல login','Log in with another number'),()=>CL.logout().then(login));return}
  const d=s.data();S.role=d.role==='owner'?'owner':'staff';S.phone=CL.phone.replace('+91','');S.logged=true;S.name=d.name||'';save();
  DB={cfg:{fares:{},comm:10,minbal:100,upi:'',office:'',staff:[]},drv:[],bk:[],rch:[],sup:[],act:[]};
  VEH.forEach(v=>DB.cfg.fares[v.id]={base:v.base,per:v.per});
  watchAll();show();
}
function mergeB(){const ids=new Set(RAWBL.map(b=>b._id));RAWB=[...RAWBL,...RAWBA.filter(b=>!ids.has(b._id))]}
function oerr(e){console.warn(e);if(e&&e.code==='permission-denied')toast(L('அனுமதி இல்லை (rules)','Permission denied (rules)'))}
function watchAll(){
  OUNS.forEach(u=>u());OUNS=[];SEEN=null;CFGOK=false;
  OUNS.push(F().onSnapshot(F().query(F().collection(CL.db,'bookings'),F().orderBy('createdAt','desc'),F().limit(400)),s=>{RAWBL=s.docs.map(d=>({_id:d.id,...d.data()}));mergeB();remap()},oerr));
  // every open booking, even if older than the newest 400 (e.g. an outstation trip booked days ahead)
  OUNS.push(F().onSnapshot(F().query(F().collection(CL.db,'bookings'),F().where('status','in',['searching','scheduled','assigned','ontrip'])),s=>{RAWBA=s.docs.map(d=>({_id:d.id,...d.data()}));mergeB();remap()},oerr));
  OUNS.push(F().onSnapshot(F().collection(CL.db,'drivers'),s=>{RAWD=s.docs.map(d=>({_id:d.id,...d.data()}));remap()},oerr));
  OUNS.push(F().onSnapshot(F().collection(CL.db,'live'),s=>{LIVE={};s.docs.forEach(d=>LIVE[d.id]=d.data());remap(true)},oerr));
  OUNS.push(F().onSnapshot(F().query(F().collection(CL.db,'recharges'),F().where('status','==','pending')),s=>{RAWRP=s.docs.map(d=>({_id:d.id,...d.data()}));remap()},oerr)); // pending ones always, however old
  OUNS.push(F().onSnapshot(F().query(F().collection(CL.db,'recharges'),F().orderBy('createdAt','desc'),F().limit(300)),s=>{RAWR=s.docs.map(d=>({_id:d.id,...d.data()}));remap()},oerr));
  OUNS.push(F().onSnapshot(F().collection(CL.db,'driverApps'),s=>{const before=(DB.apps||[]).filter(a=>a.status==='pending').length;DB.apps=s.docs.map(d=>({id:d.id,...d.data()})).sort((x,y)=>CL.toMs(y.submittedAt)-CL.toMs(x.submittedAt));const n=DB.apps.filter(a=>a.status==='pending').length;if(SEEN!==null&&n>before){chime();toast(L('புது driver விண்ணப்பம் வந்திருக்கு','New driver application'))}remap()},oerr));
  OUNS.push(F().onSnapshot(F().query(F().collection(CL.db,'tickets'),F().orderBy('createdAt','desc'),F().limit(300)),s=>{RAWT=s.docs.map(d=>({_id:d.id,...d.data()}));remap()},oerr));
  OUNS.push(F().onSnapshot(F().doc(CL.db,'config','app'),s=>{const first=!CFGOK;CFGOK=true;if(s.exists()){const d=s.data();
    Object.assign(DB.cfg,{comm:d.comm!=null?+d.comm:10,minbal:d.minbal!=null?+d.minbal:100,upi:d.upi||'',office:d.office||'',dispatch:{...DISPD,...(d.dispatch||{})},wait:d.wait||null,serverComm:!!d.serverComm,serverOps:!!d.serverOps,privPhone:!!d.privPhone,serverPin:!!d.serverPin,reqConsent:!!d.reqConsent,extNav:!!d.extNav,push:d.push||null,night:d.night||null,out:mergeOut(d.out),rent:mergeRent(d.rent),blocked:Array.isArray(d.blocked)?d.blocked:[],showBike:!!d.showBike,announce:Array.isArray(d.announce)?d.announce:[]});
    if(d.fares)Object.keys(d.fares).forEach(k=>{DB.cfg.fares[k]={...(DB.cfg.fares[k]||{}),...d.fares[k]}})}remap();
    // Settings opened before the saved settings arrived (e.g. after a refresh): draw it again with the real values
    if(first&&S.sec==='set'&&!document.querySelector('.modal')&&!typing())show()},oerr));
  OUNS.push(F().onSnapshot(F().collection(CL.db,'blocked'),s=>{BLK=new Set(s.docs.map(d=>d.id));BLKOK=true;migrateBlocked()},()=>{BLKOK=false}));
  OUNS.push(F().onSnapshot(F().collection(CL.db,'staff'),s=>{DB.cfg.staff=s.docs.filter(d=>(d.data().role||'staff')!=='owner').map(d=>({name:d.data().name||'',phone:d.id.replace('+91','')}));remap()},oerr));
}
/* one-time move of the old public blocked list into the private blocked collection (owner, after rules v2) */
let BLKMIG=false;function migrateBlocked(){const old=DB.cfg.blocked||[];if(BLKMIG||!BLKOK||S.role!=='owner'||!old.length||!CL)return;BLKMIG=true;
  const bt=F().writeBatch(CL.db);old.forEach(ph=>bt.set(F().doc(CL.db,'blocked',ph),{by:CL.phone,at:Date.now(),moved:true}));bt.update(F().doc(CL.db,'config','app'),{blocked:[],updatedAt:ts()});
  bt.commit().then(()=>{DB.cfg.blocked=[];console.info('blocked list moved')}).catch(e=>{BLKMIG=false;console.warn(e)})}
function chime(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.3].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=t?1046:784;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.28);o.start(a.currentTime+t);o.stop(a.currentTime+t+.3)})}catch(e){}}
function remap(liveOnly){
  const now=Date.now();
  DB.bk=RAWB.map(b=>mapBk(b,now));needContacts(RAWB,()=>remap());
  const busy={};RAWB.forEach(b=>{if(b.driverPhone&&(b.status==='assigned'||b.status==='ontrip'))busy[b.driverPhone]=b.status});
  const wk={};RAWB.forEach(b=>{if(b.status==='done'&&b.driverPhone&&(CL.toMs(b.doneAt)||b.when||0)>now-7*864e5)wk[b.driverPhone]=(wk[b.driverPhone]||0)+1});
  const rsum={};RAWB.forEach(b=>{if(b.status==='done'&&+b.rating>0&&b.driverPhone){const x=rsum[b.driverPhone]||(rsum[b.driverPhone]={s:0,n:0});x.s+=+b.rating;x.n++}});
  DB.drv=RAWD.map(d=>{const l=LIVE[d._id]||{};const fresh=l.updatedAt&&now-CL.toMs(l.updatedAt)<3*60e3;const online=!!(d.online&&fresh);
    const days=k=>d.docs&&d.docs[k]?Math.round((d.docs[k]-now)/864e5):999;
    return{id:d._id,ta:d.name||d._id,en:d.name||d._id,phone:d._id.replace('+91',''),veh:d.veh||'auto',plate:d.plate||'',model:d.model||'',
      status:busy[d._id]==='ontrip'?'trip':busy[d._id]?'pickup':online?'avail':'off',lat:l.lat!=null?l.lat:P.home.lat,lon:l.lon!=null?l.lon:P.home.lon,
      wallet:+d.wallet||0,rating:rsum[d._id]?+(rsum[d._id].s/rsum[d._id].n).toFixed(1):(d.rating||5),docs:{dl:days('dl'),rc:days('rc'),ins:days('ins'),permit:days('permit'),fc:days('fc')},blocked:!!d.blocked,
      svc:d.svc||null,prio:d.prio||'auto',year:vYear(d),wk:wk[d._id]||0}});
  DB.rch=[...RAWR,...RAWRP.filter(x=>!RAWR.some(y=>y._id===x._id))].filter(r=>DB.drv.some(d=>d.id===r.driverPhone)).map(r=>({id:r._id,driver:r.driverPhone,amt:+r.amt||0,utr:r.utr||'',date:r.date||CL.toMs(r.createdAt),status:r.status||'pending'})).sort((a,b)=>b.date-a.date);
  DB.sup=RAWT.map(t=>({id:'R'+t._id.slice(0,5).toUpperCase(),_id:t._id,type:t.type||'callback',cust:t.cust||'—',phone:digits(t.phone),title:t.title||{ta:'',en:''},trip:esc(t.trip||''),
    date:t.date||CL.toMs(t.createdAt),status:t.status||'open',note:t.note||'',lat:num(t.lat),lon:num(t.lon)})).sort((a,b)=>b.date-a.date);
  const STT={searching:['Driver தேடல்','needs a driver'],assigned:['driver assign ஆச்சு','driver assigned'],ontrip:['பயணம் ஆரம்பம்','trip started'],done:['முடிஞ்சது','completed'],cancelled:['ரத்து','cancelled'],scheduled:['முன்பதிவு','scheduled']};
  DB.act=RAWB.map(b=>({b,t:CL.toMs(b.updatedAt)||CL.toMs(b.createdAt)||0})).sort((x,y)=>y.t-x.t).slice(0,8).map(({b,t})=>{const st=STT[b.status]||[b.status,b.status];
    return{ta:`${shortB(b._id)} · ${b.custName||''} · ${st[0]}${b.driverName?' · '+b.driverName:''}`,en:`${shortB(b._id)} · ${b.custName||''} · ${st[1]}${b.driverName?' · '+b.driverName:''}`,date:t||now}});
  // alert the desk about new work
  const ids=new Set([...DB.bk.filter(b=>b.status==='searching').map(b=>'b'+b._id),...DB.sup.filter(s=>s.status==='open').map(s=>'t'+s._id)]);
  if(SEEN){const fresh=[...ids].filter(x=>!SEEN.has(x));if(fresh.length){chime();const sos=DB.sup.find(s=>s.type==='sos'&&s.status==='open'&&fresh.includes('t'+s._id));
    toast(sos?'SOS: '+sos.cust:fresh.some(x=>x[0]==='b')?L('புது booking வந்திருக்கு','New booking'):L('புது உதவி request','New support request'))}}
  SEEN=ids;
  clearTimeout(RTIMER);RTIMER=setTimeout(()=>rerender(liveOnly),150);
}
function rerender(liveOnly){
  if(!S.logged||document.querySelector('.modal')||typing())return;
  if(S.sec==='dash'){refreshDashLists();if(!liveOnly)updBadges();return}
  if(liveOnly&&S.sec!=='drv')return;
  if(S.sec==='set'||S.sec==='cust'||S.sec==='rep')return; // snapshot pages: refresh with their ↻ button
  const sc=main()?main().scrollTop:0;show();if(main())main().scrollTop=sc;
}
function updBadges(){app.querySelectorAll('[data-sec]').forEach(b=>{const n=badge(b.dataset.sec);let em=b.querySelector('em');if(n){if(!em){em=document.createElement('em');b.appendChild(em)}em.textContent=n}else if(em)em.remove()})}
const cw=(p)=>p.catch(e=>{if(e&&e.code==='already-done'){toast(L('இது ஏற்கனவே முடிஞ்சது','This was already handled'));return}oerr(e);toast(CL.errText(e,S.lang==='ta'))});
function bkRef(b){return F().doc(CL.db,'bookings',b._id)}
function cloudLogin(){
  app.innerHTML=`<section class="ologin"><div class="lcard"><div class="brand"><img src="./icon-192.png?v=8" alt="" style="width:40px;height:40px;border-radius:10px;flex:none" onerror="this.style.visibility='hidden'"><div><b>Vellore Taxi</b><small>Owner / Staff panel</small></div></div>
    <h1>${L('உள்ளே வாங்க','Sign in')}</h1><p class="muted" style="margin:0">${L('Owner அல்லது staff நம்பர்ல login பண்ணுங்க','Use the owner or staff number')}</p>
    <label class="kind" for="ph">${L('மொபைல் நம்பர்','Mobile number')}</label><div class="field"><span class="cc">+91</span><input id="ph" inputmode="numeric" maxlength="10" value="${esc(S.phone)}"></div>
    <div id="ow" hidden><label class="kind" for="otp">OTP</label><div class="field"><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="••••••"></div></div>
    <div class="err" id="le"></div><button class="btn" id="lgn">${L('OTP அனுப்பு','Send OTP')}</button>
    <div class="lang2"><button data-l="ta" class="${S.lang==='ta'?'on':''}">தமிழ்</button><button data-l="en" class="${S.lang==='en'?'on':''}">English</button></div></div></section>`;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{S.lang=b.dataset.l;save();cloudLogin()});
  const ph=document.getElementById('ph'),otp=document.getElementById('otp'),b=document.getElementById('lgn'),le=document.getElementById('le'),ow=document.getElementById('ow');let stage=0;
  ph.oninput=()=>{ph.value=ph.value.replace(/\D/g,'').slice(0,10);le.textContent=''};otp.oninput=()=>{otp.value=otp.value.replace(/\D/g,'').slice(0,6);le.textContent='';if(otp.value.length===6)b.click()};
  b.onclick=()=>{
    if(!stage){if(!/^[6-9]\d{9}$/.test(ph.value)){le.textContent=L('10 இலக்க நம்பர் கொடுங்க','Enter a 10-digit number');return}
      b.disabled=true;b.textContent=L('OTP அனுப்புது…','Sending OTP…');
      CL.sendOtp(ph.value).then(()=>{stage=1;ph.disabled=true;ow.hidden=false;b.disabled=false;b.textContent=L('உள்ளே போ','Sign in');otp.focus()}).catch(e=>{b.disabled=false;b.textContent=L('OTP அனுப்பு','Send OTP');le.textContent=CL.errText(e,S.lang==='ta')});return}
    if(otp.value.length!==6){le.textContent=L('6 இலக்க OTP போடுங்க','Enter the 6-digit OTP');return}
    b.disabled=true;CL.verifyOtp(otp.value).then(()=>enterCloud()).catch(e=>{b.disabled=false;le.textContent=CL.errText(e,S.lang==='ta');otp.value='';otp.focus()});
  };
  setTimeout(()=>ph.focus(),200);
}

app.innerHTML='<section class="ologin"><div class="lcard"><div class="brand"><img src="./icon-192.png?v=8" alt="" style="width:40px;height:40px;border-radius:10px;flex:none" onerror="this.style.visibility=\'hidden\'"><div><b>Vellore Taxi</b><small>Loading…</small></div></div></div></section>';
cloudP.then(async()=>{if(await cloudBootO())return;if(S.logged){startSim(liveRefresh);show()}else login()});

</script>
