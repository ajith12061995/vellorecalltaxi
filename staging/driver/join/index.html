function login(){
  head(L('Vellore Taxi-ல Driver-ஆ சேருங்க','Join Vellore Taxi as a driver'),L('உங்க விவரம், documents upload பண்ணுங்க. Office பார்த்து approve பண்ணதும் ride எடுக்கலாம்.','Upload your details and documents. Once our office approves, you can start taking rides.'));

    <div class="err" id="e"></div><button class="btn" id="go" disabled>${L('OTP அனுப்பு','Send OTP')}</button></div>
    <div class="note">${L('தயாரா வச்சுக்கோங்க: ஆதார், ஓட்டுநர் உரிமம், RC (முன் + பின்), Insurance, (இருந்தா) PAN, Permit, FC. போன் camera-ல photo எடுத்தா போதும்.','Keep ready: Aadhaar, driving licence and RC (front and back), insurance, and PAN, permit and FC if you have them. Phone camera photos are fine.')}</div>`;

function otp(){
  head(L('OTP போடுங்க','Enter the OTP'),L(`+91 ${S.phone}-க்கு SMS-ல வந்த 6 இலக்க OTP`,`The 6-digit code sent to +91 ${S.phone}`));
  app.innerHTML=`<div class="card"><div class="otp">${[0,1,2,3,4,5].map(i=>`<input id="o${i}" inputmode="numeric" autocomplete="${i?'off':'one-time-code'}">`).join('')}</div>

  const ins=[...app.querySelectorAll('.otp input')],vf=document.getElementById('vf');

  ins.forEach((x,i)=>x.setAttribute('autocomplete',i?'off':'one-time-code'));

  vf.onclick=async()=>{vf.disabled=true;try{await CL.verifyOtp(code());await afterLogin()}catch(e){document.getElementById('e').textContent=CL.errText(e,S.lang==='ta');box.reset();vf.disabled=true}};

async function afterLogin(){
  S.phone=CL.phone.replace('+91','');
  try{const st=await F.getDoc(F.doc(CL.db,'staff',CL.phone));if(st.exists()){go('owner');return}}catch(e){}
  try{const d=await F.getDoc(F.doc(CL.db,'drivers',CL.phone));if(d.exists()){S.app={status:'approved'};go('status');return}}catch(e){}
  try{const a=await F.getDoc(F.doc(CL.db,'driverApps',CL.phone));if(a.exists()){S.app=a.data();S.data=a.data();if(S.data.veh)S.veh=S.data.veh;go(S.app.status==='rejected'?'form':'status');return}}catch(e){}
  S.app=null;go('form');
}

/* shrink a photo on the phone so it uploads fast and fits the database (~150–300 KB) */
function shrink(file){return new Promise((res,rej)=>{
  if(!file||!/^image\//.test(file.type)){rej(new Error('type'));return}
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const max=1280,k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);let q=.72,d=c.toDataURL('image/jpeg',q);while(d.length>700000&&q>.35){q-=.1;d=c.toDataURL('image/jpeg',q)}
    d.length>900000?rej(new Error('big')):res(d)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('read'))};img.src=url});}

  const had=k=>!!S.files[k]||(D.files||[]).includes(k);
  const B=BRANDS[S.veh]||{},brand=D.brand||'',bOther=brand&&!B[brand],models=B[brand]||[],mOther=D.model&&!models.includes(D.model);
  const tile=k=>{const s=SLOTS[k];return `<div class="doc ${had(k)?'has':''}" id="d_${k}">${S.files[k]?`<img src="${S.files[k]}" alt="">`:had(k)?`<span style="color:#12664A">${X('check',30)}</span>`:`<span style="opacity:.6">${X('camera',30)}</span>`}
        <b>${S.lang==='ta'?s[0]:s[1]}${s[2]?' <span class="req">*</span>':''}</b><small>${had(k)?L('மாத்த தொடுங்க','Tap to change'):L('Photo எடுங்க','Take a photo')}</small>
        <input type="file" accept="image/*" data-f="${k}" aria-label="${s[1]}"></div>`};
  app.innerHTML=`<div class="card"><h2>${L('2. நீங்க','2. About you')}</h2>
      <label for="nm">${L('உங்க பெயர் *','Your name *')}</label><input id="nm" type="text" maxlength="40" value="${esc(D.name||'')}" autocomplete="name">
      <label for="ecp">${L('குடும்பத்தினர் mobile எண் (அவசரத்துக்கு) *','A family member\'s mobile number (for emergencies) *')}</label>
      <div class="ph"><b>+91</b><input id="ecp" type="tel" inputmode="numeric" maxlength="10" value="${esc((D.ecPhone||'').replace('+91',''))}" placeholder="98765 43210"></div>
      <label for="rfp">${L('உங்களை சேர்த்து விட்ட driver-ன் mobile எண் (இருந்தா)','Mobile number of the driver who referred you (if any)')}</label>
      <div class="ph"><b>+91</b><input id="rfp" type="tel" inputmode="numeric" maxlength="10" value="${esc(String(D.ref!=null?D.ref:(VCTREF.fromUrl(location.search,S.phone)||'')).replace('+91',''))}" placeholder="98765 43210"></div>
    </div>
    <div class="card"><h2>${L('3. வண்டி','3. Vehicle')}</h2>
      <label style="margin-top:0">${L('வண்டி வகை *','Vehicle type *')}</label>
      <div class="chips">${VEH.map(v=>`<button type="button" class="chip ${v[0]===S.veh?'on':''}" data-v="${v[0]}">${S.lang==='ta'?v[1]:v[2]}</button>`).join('')}</div>
      <div class="row2"><div><label for="br">${L('நிறுவனம் (Brand) *','Brand *')}</label><select id="br"><option value="">${L('தேர்ந்தெடுங்க','Choose')}</option>${Object.keys(B).map(b=>`<option ${b===brand?'selected':''}>${esc(b)}</option>`).join('')}<option value="${OTHER}" ${bOther?'selected':''}>${L('மற்றவை','Other')}</option></select></div>
      <div><label for="mo">${L('Model *','Model *')}</label><select id="mo" ${brand||bOther?'':'disabled'}><option value="">${L('தேர்ந்தெடுங்க','Choose')}</option>${models.map(m=>`<option ${m===D.model?'selected':''}>${esc(m)}</option>`).join('')}<option value="${OTHER}" ${(bOther||mOther)&&D.model?'selected':''}>${L('மற்றவை','Other')}</option></select></div></div>
      <div class="row2" id="oth" ${bOther||mOther||D.brandOther||D.modelOther?'':'hidden'}><div><input id="brx" type="text" maxlength="20" placeholder="${L('நிறுவன பெயர்','Brand name')}" value="${bOther?esc(brand):''}" ${bOther||D.brandOther?'':'hidden'}></div><div><input id="mox" type="text" maxlength="24" placeholder="${L('Model பெயர்','Model name')}" value="${(bOther||mOther)?esc(D.model||''):''}"></div></div>
      <label for="pl">${L('வண்டி எண் *','Number plate *')}</label><input id="pl" type="text" maxlength="14" style="text-transform:uppercase" value="${esc(D.plate||'')}" placeholder="TN 23 AB 1234"></div>
    <div class="card"><h2>${L('4. Photo-கள்','4. Photos')}</h2>
      <p style="font-size:13px;color:var(--mut);margin:-4px 0 6px">${L('ஒவ்வொரு கட்டத்தையும் தொட்டு photo எடுங்க, அல்லது gallery-ல இருந்து தேர்ந்தெடுங்க. எண், தேதி எதுவும் type பண்ண வேண்டாம்.','Tap each box to take a photo or pick one from your gallery. No numbers or dates to type.')}</p>
      ${GROUPS.map(([ta,en,keys,hta,hen])=>`<label style="margin-top:14px">${S.lang==='ta'?ta:en}</label>${hta?`<small style="display:block;color:var(--mut);margin:-2px 0 6px">${S.lang==='ta'?hta:hen}</small>`:''}<div class="docs">${keys.map(tile).join('')}</div>`).join('')}</div>
    <div class="card"><h2>${L('5. Driver ஒப்பந்தம்','5. Driver agreement')}</h2>
      <p style="font-size:13px;color:var(--mut);margin:-4px 0 8px">${L('படிங்க (அல்லது யாரையாவது படிச்சு காட்ட சொல்லுங்க). கீழே ✓ போடுறது தான் உங்க ஒப்புதல்.','Read it (or ask someone to read it to you). Ticking the box below is your acceptance.')}</p>
      <ol class="agr">${VCTCHK.AGREEMENT[S.lang==='ta'?'ta':'en'].map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
      <label class="chk" style="color:var(--fg)"><input type="checkbox" id="agree" ${D.agreed||D.consent?'checked':''}> <span>${L('மேலே உள்ள 10 விதிகளையும் படித்தேன் / கேட்டேன், ஏற்கிறேன். <a href="../../privacy/#drivers" target="_blank" rel="noopener">தனியுரிமை & விதிமுறைகள்</a>','I have read (or heard) and accept all 10 points above. <a href="../../privacy/#drivers" target="_blank" rel="noopener">Privacy & Terms</a>')}</span></label>
      <small style="display:block;color:var(--mut);margin-top:4px">${L('உங்க பெயர், mobile எண், தேதி, நேரம் தானா பதிவாகும்.','Your name, mobile number, date and time are recorded automatically.')}</small>
      <div class="err" id="e"></div><div class="prog" id="pg" hidden><i></i></div>
      <button class="btn y" id="sb">${L('Office-க்கு அனுப்பு','Send to office')}</button>
      <button class="btn ghost" id="lo2" style="border:0;font-size:14px;margin-top:6px">${L('நீங்க ஏற்கனவே driver-ஆ? வேற நம்பர்ல login','Already a driver? Log in with another number')}</button></div>`;
  const val=id=>(document.getElementById(id)||{}).value||'';
  const snap=()=>{const br=val('br'),mo=val('mo');S.data={...S.data,brandOther:br===OTHER,modelOther:br===OTHER||mo===OTHER,brand:br===OTHER?val('brx').trim():br,model:(br===OTHER||mo===OTHER)?val('mox').trim():mo,name:val('nm').trim(),ecPhone:val('ecp').replace(/\D/g,'').slice(0,10),ref:val('rfp').replace(/\D/g,'').slice(0,10),agreed:document.getElementById('agree').checked,plate:val('pl').trim().toUpperCase()}};
  app.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{snap();S.veh=b.dataset.v;S.data.brand='';S.data.model='';S.data.brandOther=S.data.modelOther=false;form()});
  document.getElementById('br').onchange=()=>{snap();S.data.model='';if(val('br')!==OTHER)S.data.modelOther=false;form()};
  document.getElementById('mo').onchange=()=>{snap();form()};
  app.querySelectorAll('[data-f]').forEach(inp=>inp.onchange=async()=>{const k=inp.dataset.f,box=document.getElementById('d_'+k);box.querySelector('small').textContent=L('தயார் பண்ணுது…','Preparing…');
    try{S.files[k]=await shrink(inp.files[0]);snap();form();const el=document.getElementById('d_'+k);if(el)el.scrollIntoView({block:'center'})}catch(e){box.querySelector('small').textContent=e.message==='type'?L('Photo மட்டும் (PDF வேண்டாம்)','Photos only (no PDF)'):L('இந்த photo வேலை செய்யல. மறுபடி எடுங்க','That photo didn’t work. Take it again')}});
  document.getElementById('sb').onclick=()=>{snap();submit()};
  document.getElementById('lo2').onclick=()=>{snap();CL.logout().then(()=>location.replace('../'))}; // back to the driver app login
}
async function submit(){
  const e=document.getElementById('e'),D=S.data,had=((S.app&&S.app.files)||[]).map(k=>OLDKEYS[k]||k);
  const missing=[];if((D.name||'').length<3)missing.push(L('பெயர்','name'));
  if(!/^[6-9]\d{9}$/.test(D.ecPhone||''))missing.push(L('குடும்பத்தினர் எண்','family number'));else if(D.ecPhone===S.phone)missing.push(L('குடும்பத்தினர் எண் (உங்க நம்பர் இல்லாம வேற நம்பர்)','family number (a different number, not yours)'));
  if(!D.brand)missing.push(L('நிறுவனம் (Brand)','brand'));if(!D.model)missing.push('Model');
  if((D.plate||'').length<6)missing.push(L('வண்டி எண்','plate'));
  GROUPS.forEach(([gta,gen,keys])=>keys.forEach(k=>{const s=SLOTS[k];if(s[2]&&!S.files[k]&&!had.includes(k))missing.push((S.lang==='ta'?gta:gen)+(keys.length>1?' – '+(S.lang==='ta'?s[0]:s[1]):''))}));
  if(missing.length){e.textContent=L('இது இல்லை: ','Missing: ')+missing.join(', ');return}
  if(D.ref&&!VCTREF.clean(D.ref,S.phone)){e.textContent=String(D.ref).replace(/\D/g,'').slice(-10)===S.phone?L('சேர்த்து விட்டவர் எண்ணா உங்க சொந்த எண்ணை போட முடியாது. காலியா விடுங்க','You cannot give your own number as the referrer. Leave it empty'):L('சேர்த்து விட்டவர் எண் சரியில்லை (10 இலக்கம்). தெரியலைன்னா காலியா விடுங்க','The referrer number is not valid (10 digits). Leave it empty if unsure');return}
  if(!D.agreed){e.textContent=L('ஒப்பந்தத்தை படிச்சு ✓ போடுங்க','Read the agreement and tick it');return}
  {const files=[...new Set([...had,...Object.keys(S.files)])],consent={v:VCTCHK.AGREEMENT.v,name:D.name,at:Date.now(),lang:S.lang,how:'tick'};
   const r=VCTCHK.check({...D,exp:{},phone:CL.phone,ecPhone:'+91'+D.ecPhone,files,consent},[],Date.now()),bad=r.items.filter(x=>x.level==='bad');
   if(bad.length){e.textContent=L('சரி பண்ணுங்க: ','Please fix: ')+bad.map(x=>S.lang==='ta'?x.ta:x.en).join(' · ');return}
   D.consent=consent}
  const sb=document.getElementById('sb'),pg=document.getElementById('pg');sb.disabled=true;sb.textContent=L('அனுப்புது…','Sending…');pg.hidden=false;e.textContent='';
  const keys=Object.keys(S.files),bar=n=>pg.firstChild.style.width=Math.round(n*100)+'%';
  try{
    const ref=F.doc(CL.db,'driverApps',CL.phone);
    await F.setDoc(ref,{name:D.name,phone:CL.phone,ecName:D.ecName||'',ecPhone:'+91'+D.ecPhone,dlNo:D.dlNo||'',years:+D.years||0,area:D.area||'',veh:S.veh,brand:D.brand||'',model:D.model||'',year:+D.year||null,plate:D.plate,ownVehicle:D.ownVehicle==null?null:!!D.ownVehicle,exp:D.exp||{},upi:D.upi||'',form:2,ref:VCTREF.clean(D.ref,S.phone),consent:{...D.consent,ua:navigator.userAgent.slice(0,140)},
      files:had,status:'pending',note:'',submittedAt:F.serverTimestamp(),updatedAt:F.serverTimestamp()},{merge:true});
    bar(.08);
    for(let i=0;i<keys.length;i++){await F.setDoc(F.doc(CL.db,'driverApps',CL.phone,'files',keys[i]),{data:S.files[keys[i]],at:Date.now()});bar(.08+.88*(i+1)/keys.length)}
    const all=[...new Set([...had,...keys])];
    await F.updateDoc(ref,{files:all,status:'pending',updatedAt:F.serverTimestamp()});bar(1);
    S.app={...D,status:'pending',files:all};S.files={};go('status');
  }catch(err){e.textContent=CL.errText(err,S.lang==='ta');sb.disabled=false;sb.textContent=L('மறுபடி அனுப்பு','Send again')}
}
let WATCH=null;
function watchStatus(){if(WATCH||!CL)return;
  const u1=F.onSnapshot(F.doc(CL.db,'driverApps',CL.phone),x=>{if(!x.exists())return;const d=x.data();const was=S.app&&S.app.status;S.app=d;
    if(d.status==='rejected'&&was!=='rejected'){S.data=d;go('form')}},()=>{});
  const u2=F.onSnapshot(F.doc(CL.db,'drivers',CL.phone),x=>{if(x.exists()){S.app={status:'approved'};go('status');setTimeout(()=>location.href='../',2500)}},()=>{});
  WATCH=()=>{u1();u2()}}
function status(){
  const st=(S.app&&S.app.status)||'pending';
  if(st==='approved'){head(L('வாழ்த்துக்கள்!','Welcome aboard!'),L('நீங்க இப்போ Vellore Taxi driver','You are now a Vellore Taxi driver'));
    app.innerHTML=`<div class="card status"><div class="ic" style="color:#12664A">${X('check',52)}</div><h2>${L('Approve ஆயிடுச்சு','Approved')}</h2><p>${L('Driver screen திறக்குது… Wallet recharge பண்ணிட்டு Online போங்க. ⋮ → "Add to Home screen" பண்ணிக்கோங்க.','Opening the driver screen… Recharge your wallet, then go online. Use ⋮ → "Add to Home screen".')}</p>
      <a class="btn" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="../">${L('Driver app திற','Open the driver app')}</a></div>`;setTimeout(()=>{location.href='../'},2500);return}
  watchStatus();head(L('விண்ணப்பம் அனுப்பியாச்சு','Application sent'),L('Office பார்த்து approve பண்ணுவாங்க','Our office will review it'));
  app.innerHTML=`<div class="card status"><div class="ic" style="color:#B57A00">${X('clock',52)}</div><h2>${L('Approval-க்கு காத்திருக்கு','Waiting for approval')}</h2>
    <p>${L('பொதுவா 1 நாளுக்குள்ள approve பண்ணுவோம். Approve ஆனதும் இந்த app தானா driver screen-க்கு மாறிடும். App-ஐ மூடிட்டு பின்னாடி திறந்தாலும் பரவாயில்லை. தேவைப்பட்டா office உங்களை அழைக்கும்.','We usually review within a day. When approved, this app switches to the driver screen by itself — you can close it and come back later. Our office may call you.')}</p>
    <button class="btn ghost" id="rf">${L('நிலையை பார்','Check status')}</button><button class="btn ghost" id="ed">${L('விவரத்தை மாத்து','Edit details')}</button><button class="btn ghost" id="lo" style="border:0;font-size:14px">${L('வேற நம்பர்ல login','Use another number')}</button></div>`;
  document.getElementById('lo').onclick=()=>{if(WATCH){WATCH();WATCH=null}CL.logout().then(()=>go('login'))};
  document.getElementById('rf').onclick=()=>afterLogin();
  document.getElementById('ed').onclick=()=>go('form');
}
(async function(){
  setLang();app.innerHTML=`<p style="text-align:center;color:var(--mut)">${L('ஏத்துது…','Loading…')}</p>`;
  CL=await window.CLOUD_READY;if(!CL){go('offline');return}F=CL.fs;
  const u=await CL.waitUser();if(u&&u.phoneNumber)await afterLogin();else go('login');
})();
</script>
