<title>Vellore Taxi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;600;700;800&family=Hind+Madurai:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one phone-width app column; map is the stage, a white bottom sheet carries the actions. */
:root{
  --yellow:#FFC21A; --yellow-soft:#FFF5C9; --yellow-ink:#7A5A00;
  --navy:#12664A; --navy-2:#2C5196; --navy-soft:#E6EDF9;
  --bg:#F5F7F2; --surface:#FFFFFF; --surface-2:#F7FAF8;
  --fg:#0B4A36; --muted:#5B6B64; --line:#E1E8E4;
  --map-land:#EDF1F7; --map-block:#E3E9F2; --map-road:#FFFFFF; --map-edge:#D3E2DA; --map-river:#CBE1F4; --map-label:#56657F; --map-bldg:#D6DEEA;
  --ok:#1E8A5A; --danger:#C23B3B;
  --shadow:0 10px 30px rgba(19,40,79,.12);
  --display:"Baloo Thambi 2","Hind Madurai",system-ui,sans-serif;
  --body:"Hind Madurai","Noto Sans Tamil",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --yellow:#FFC21A; --yellow-soft:#3A3417; --yellow-ink:#FFE38A;
  --navy:#7FD3A8; --navy-2:#A8D5C0; --navy-soft:#1B3129;
  --bg:#0A1712; --surface:#11231C; --surface-2:#183026; --fg:#E8F2EC; --muted:#9DB3A9; --line:#23392F;
  --map-land:#0E1D17; --map-block:#12241D; --map-road:#284236; --map-edge:#182E25; --map-river:#164032; --map-label:#8FA59B; --map-bldg:#1A3328;
  --ok:#4CC28C; --danger:#F07A7A; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --yellow:#FFC21A; --yellow-soft:#3A3417; --yellow-ink:#FFE38A;
  --navy:#7FD3A8; --navy-2:#A8D5C0; --navy-soft:#1B3129;
  --bg:#0A1712; --surface:#11231C; --surface-2:#183026; --fg:#E8F2EC; --muted:#9DB3A9; --line:#23392F;
  --map-land:#0E1D17; --map-block:#12241D; --map-road:#284236; --map-edge:#182E25; --map-river:#164032; --map-label:#8FA59B; --map-bldg:#1A3328;
  --ok:#4CC28C; --danger:#F07A7A; --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{position:relative;height:100%;max-width:440px;margin:0 auto;background:var(--surface);overflow:hidden}
@media (min-width:520px){.app{height:calc(100% - 32px);margin-block:16px;border-radius:28px;box-shadow:var(--shadow);border:1px solid var(--line)}}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);animation:in .32s ease both}
@keyframes in{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pad{padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
.muted{color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:54px;border-radius:16px;background:var(--navy);color:#fff;font-weight:700;font-size:16px;transition:transform .12s, opacity .2s}
:root[data-theme="dark"] .btn{color:#0A1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#0A1712}}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.yellow{background:var(--yellow);color:#0B4A36}

/* splash */
#splash{background:#0B4A36;color:#fff;align-items:center;justify-content:center;gap:22px}
.roofsign{background:var(--yellow);color:#0B4A36;border-radius:14px 14px 6px 6px;padding:14px 22px 10px;text-align:center;box-shadow:0 14px 0 -6px #0b1a36, 0 0 0 4px rgba(255,216,77,.25);animation:pop .6s cubic-bezier(.2,1.4,.4,1) both}
.roofsign b{display:block;font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:.06em}
.roofsign span{font-family:var(--display);font-size:17px;font-weight:600}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.road{width:220px;height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,#FFC21A 0 26px,transparent 26px 44px);background-size:44px 6px;animation:roll .6s linear infinite;opacity:.8}
@keyframes roll{to{background-position:-44px 0}}
.tag{font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.7}

/* onboarding */
.hero{background:linear-gradient(170deg,var(--yellow) 0%,var(--yellow-soft) 100%);padding-top:48px;padding-bottom:28px;display:flex;flex-direction:column;gap:10px;border-radius:0 0 32px 32px}
.hero h1{font-size:30px;color:#0B4A36}
.hero p{margin:0;color:#3D4D6E}
.hero .mini{display:inline-flex;align-self:flex-start;background:#0B4A36;color:var(--yellow);font-family:var(--display);font-weight:700;padding:4px 12px;border-radius:999px;font-size:13px;letter-spacing:.06em}
.body{flex:1;display:flex;flex-direction:column;gap:16px;padding-top:24px;padding-bottom:max(20px,env(safe-area-inset-bottom,0px));overflow:auto}
.langcard{display:flex;align-items:center;justify-content:space-between;padding:18px;border:2px solid var(--line);border-radius:18px;text-align:left;background:var(--surface)}
.langcard.sel{border-color:var(--navy);background:var(--navy-soft)}
.langcard b{font-family:var(--display);font-size:22px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}
.sel .radio{border:7px solid var(--navy)}
.field{display:flex;align-items:center;gap:10px;height:58px;border:2px solid var(--line);border-radius:16px;padding:0 16px;background:var(--surface)}
.field:focus-within{border-color:var(--navy)}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:19px;color:var(--fg);letter-spacing:.04em}
.field .cc{font-weight:700;padding-right:10px;border-right:1px solid var(--line)}
.otp{display:flex;gap:12px}
.otp input{width:100%;min-width:0;height:62px;text-align:center;font-size:26px;font-family:var(--display);font-weight:700;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--fg)}
.otp input:focus{border-color:var(--navy);outline:0}
.riderrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;border-radius:14px;border:1px dashed var(--line);background:var(--surface);text-align:left;color:var(--fg)}
.riderrow span{font-size:20px}.riderrow div{flex:1;min-width:0}.riderrow small{display:block;font-size:11.5px;color:var(--muted);font-weight:700}.riderrow b{font-size:14px}.riderrow i{font-style:normal;font-size:12.5px;font-weight:700;color:var(--navy)}
.welcome{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:16px;background:var(--navy-soft);border:1px solid var(--line)}.welcome small{color:var(--muted);font-size:13px}
.tpcard{max-height:92vh;overflow:auto}
.tpsum{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:linear-gradient(135deg,#0B4A36,#12664A);color:#fff}.tpsum span{font-size:20px}.tpsum b{font-size:16px}
.tpdays{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;margin:10px -2px 0;padding:2px}.tpdays::-webkit-scrollbar{display:none}
.tpdays button{flex:none;width:62px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:16px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);scroll-snap-align:start}
.tpdays button b{font-family:var(--display);font-size:22px;line-height:1.1}.tpdays button small{font-size:11px;color:var(--muted);font-weight:700}
.tpdays button.on{background:var(--yellow);border-color:var(--yellow);color:#0B4A36}.tpdays button.on small{color:#0B4A36}
.tpquick{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.tpquick button{height:34px;padding:0 12px;border-radius:999px;border:1.5px dashed #1E8A5A;color:#1E8A5A;font-weight:700;font-size:13px;background:none}.tpquick button.on{background:#1E8A5A;color:#fff;border-style:solid}
.tpper{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}.tpper button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:14px;border:1px solid var(--line);background:var(--surface-2);font-size:11.5px;font-weight:700;color:var(--muted)}
.tpper button span{font-size:18px}.tpper button.on{background:#0B4A36;color:#fff;border-color:#0B4A36}.tpper button:disabled{opacity:.35}
.tpgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;max-height:190px;overflow:auto;padding:2px}
.tpgrid button{height:42px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13.5px;color:var(--fg)}.tpgrid button.on{background:var(--yellow);border-color:var(--yellow);color:#0B4A36;box-shadow:0 4px 12px rgba(255,194,26,.4)}
#otab button{display:flex;flex-direction:column;align-items:center;height:auto;padding:6px 4px;gap:1px}#otab small{font-size:10.5px;font-weight:600;opacity:.85}
.tipbox{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:var(--yellow-soft);border:1.5px solid var(--yellow)}.tipbox[hidden]{display:none}
.tiprow{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin:0 -2px;padding:2px}.tiprow::-webkit-scrollbar{display:none}
.tiprow .chip{flex:0 0 calc((100% - 24px)/5);justify-content:center;scroll-snap-align:start;padding:0;height:40px;font-weight:700}
.tippre{display:flex;flex-direction:column;gap:8px;padding:12px 14px;border-radius:16px;background:var(--yellow-soft)}.tippre b{font-size:14.5px;color:var(--yellow-ink);display:block}.tippre small{color:var(--muted);font-size:12px}.tippre .chip.sel{background:#1E8A5A;border-color:#1E8A5A;color:#fff}
.rounds{display:flex;align-items:center;gap:6px;margin:-4px 0 2px}.rounds i{flex:0 0 34px;height:6px;border-radius:4px;background:var(--line)}.rounds i.on{background:linear-gradient(90deg,#1E8A5A,#F5B800);animation:rpulse 1.2s infinite}.rounds i.done{background:#C9A23A}.rounds span{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes rpulse{50%{opacity:.45}}.tipbox.flash{animation:tflash .9s 2}@keyframes tflash{50%{box-shadow:0 0 0 6px rgba(245,184,0,.35)}}.tiprow .chip.pop{transform:scale(1.12);background:#1E8A5A;color:#fff;border-color:#1E8A5A}
.tipbox b{font-size:15px;color:var(--yellow-ink)}.tipbox small{color:var(--muted);font-size:12.5px}.tipbox .chip.sel{background:#1E8A5A;border-color:#1E8A5A;color:#fff}
.dsp{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:18px;border:1.5px solid var(--navy);background:var(--navy-soft)}
.dsp .dt{display:flex;align-items:center;gap:10px}.dsp .dt b{flex:1;font-size:15px}.dsp .dt em{font-style:normal;font-family:var(--display);font-size:20px;color:var(--navy);font-variant-numeric:tabular-nums}
.dsp small{color:var(--muted);font-size:12.5px}.dsp .steps{display:flex;gap:4px}.dsp .steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.dsp .steps i.on{background:var(--navy)}.dsp .steps i.cur{background:var(--yellow);animation:pulse 1.2s ease-in-out infinite alternate}
.dsp.ok{border-color:#1E8A5A;background:rgba(30,138,90,.10)}.dsp.ok .dt b{color:#1E8A5A}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
.osched{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1.5px solid var(--navy);background:var(--surface);color:var(--fg)}
.osched div{flex:1;min-width:0}.osched small{display:block;font-size:12px;font-weight:700;color:var(--navy);text-transform:uppercase;letter-spacing:.06em}.osched b{display:block;font-size:14.5px;margin-top:2px}.osched i{font-style:normal;font-size:24px;color:var(--navy)}
.note{background:var(--yellow-soft);color:var(--yellow-ink);border-radius:14px;padding:10px 14px;font-size:13.5px}
.err{color:var(--danger);font-size:13.5px;min-height:18px}
.linkbtn{color:var(--navy);font-weight:700;font-size:14px}
.fine{font-size:12.5px;text-align:center}

/* home */
.mapwrap{position:relative;flex:1 1 auto;min-height:230px}
canvas.map{position:absolute;inset:0;width:100%;height:100%;display:block}
.topbar{position:absolute;top:max(14px,env(safe-area-inset-top,0px));left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;z-index:2}
.chipbtn{height:42px;min-width:42px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:700;font-size:13.5px}
.greet{flex:1;min-width:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:6px 12px;line-height:1.2}
.greet small{display:block;color:var(--muted);font-size:12px}
.greet b{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.locate{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:30px;z-index:2}
.nearby{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:30px;z-index:2;background:var(--navy);color:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
:root[data-theme="dark"] .nearby{color:#0A1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nearby{color:#0A1712}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);box-shadow:0 0 0 0 rgba(255,216,77,.7);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(255,216,77,0)}100%{box-shadow:0 0 0 0 rgba(255,216,77,0)}}
.sheet{position:relative;z-index:3;margin-top:-22px;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -8px 24px rgba(19,40,79,.08);display:flex;flex-direction:column;gap:16px;padding-top:12px;padding-bottom:14px;max-height:62%;overflow:auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.where{display:flex;align-items:center;gap:12px;height:58px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line);padding:0 8px 0 16px;text-align:left;width:100%}
.where span{flex:1;font-family:var(--display);font-weight:700;font-size:19px}
.where i{width:42px;height:42px;border-radius:13px;background:var(--yellow);display:flex;align-items:center;justify-content:center}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-2px;padding:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;white-space:nowrap}
.sec{display:flex;align-items:baseline;justify-content:space-between}
.sec h3{font-size:17px}
.services{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.svc{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.svc i{width:100%;aspect-ratio:1;max-width:72px;border-radius:18px;background:var(--navy-soft);display:flex;align-items:center;justify-content:center}
.svc:first-child i{background:var(--yellow)}
.offers{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:2px}
.offers::-webkit-scrollbar{display:none}
.offer{flex:none;width:78%;scroll-snap-align:start;border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;min-height:120px}
.offer b{font-family:var(--display);font-size:20px;line-height:1.15}
.offer small{opacity:.85;font-size:12.5px}
.offer .code{align-self:flex-start;margin-top:auto;border:1.5px dashed currentColor;border-radius:8px;padding:2px 10px;font-weight:700;letter-spacing:.08em;font-size:13px}
.offer.o1{background:#0B4A36;color:#FFC21A}
.offer.o2{background:#FFC21A;color:#0B4A36}
.offer.o3{background:#2C5196;color:#fff}
.offer svg{position:absolute;right:-14px;bottom:-12px;opacity:.18}
.sample{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.recent{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.row div{flex:1;min-width:0}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--muted);font-size:12.5px}
.nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface);padding-bottom:max(6px,env(safe-area-inset-bottom,0px));position:relative;z-index:4}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.nav button.on{color:var(--navy)}
.nav button.on svg{background:var(--yellow-soft);border-radius:10px}
.nav svg{width:44px;height:28px;padding:3px 10px}

/* search */
.head{display:flex;align-items:center;gap:10px;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:10px}
.head h2{font-size:20px;flex:1}
.back{width:42px;height:42px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.route-in{display:flex;gap:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:10px 12px}
.rail{display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:0}
.rail .a{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.rail .l{width:2px;flex:1;min-height:28px;background:repeating-linear-gradient(var(--muted) 0 3px,transparent 3px 6px)}
.rail .b{width:10px;height:10px;border-radius:2px;background:var(--danger)}
.ins{flex:1;min-width:0;display:flex;flex-direction:column}
.ins input{height:44px;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--fg);min-width:0}
.ins input:first-child{border-bottom:1px solid var(--line)}
.ins input:focus{color:var(--navy)}
.mic{width:44px;height:44px;border-radius:14px;background:var(--yellow);display:flex;align-items:center;justify-content:center;align-self:flex-end;flex:none}
.list{flex:1;overflow:auto;padding-bottom:20px}
.tagline{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:16px 0 4px}

/* fare */
.fare-sheet{gap:12px;max-height:68%}
.trip{display:flex;gap:10px;align-items:center;font-size:13.5px}
.trip b{font-family:var(--display);font-size:16px}
.pill{display:inline-flex;align-items:center;gap:4px;background:var(--navy-soft);color:var(--navy);border-radius:999px;padding:3px 10px;font-weight:700;font-size:12.5px;white-space:nowrap}
.veh{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;border:2px solid var(--line);text-align:left;width:100%;background:var(--surface);transition:border-color .15s, background .15s}
.veh.sel{border-color:var(--navy);background:var(--navy-soft)}
.veh .vi{width:58px;height:44px;border-radius:12px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;flex:none}
.veh div{flex:1;min-width:0}
.veh b{font-family:var(--display);font-size:17px;display:block}
.veh small{color:var(--muted);font-size:12.5px}
.veh .price{text-align:right;flex:none}
.veh .price b{font-size:20px;font-variant-numeric:tabular-nums}
.veh .price s{color:var(--muted);font-size:12px}
.payrow{display:flex;gap:8px}
.pay{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:44px;border-radius:14px;border:1.5px solid var(--line);font-weight:700;font-size:14px}
.pay.sel{border-color:var(--navy);background:var(--navy-soft);color:var(--navy)}


canvas.map{touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
canvas.map:active{cursor:grabbing}
.zoomctl{position:absolute;right:max(14px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;z-index:2}
.zoomctl .chipbtn{font-size:22px;font-weight:700;width:44px;height:44px;padding:0}
.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(14px,env(safe-area-inset-top,0px)) + 56px);z-index:2;background:rgba(19,40,79,.88);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;transition:opacity .4s;pointer-events:none}
.hint.gone{opacity:0}
.pin{position:absolute;left:50%;top:50%;z-index:3;pointer-events:none;transform:translate(-50%,-97%);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.pin.lift{transform:translate(-50%,calc(-97% - 16px))}
.pinshadow{position:absolute;left:50%;top:50%;width:18px;height:7px;border-radius:50%;background:rgba(19,40,79,.4);transform:translate(-50%,-50%);z-index:2;pointer-events:none;transition:.2s}
.pin.lift + .pinshadow{width:10px;opacity:.45}
.pickcard{display:flex;flex-direction:column;gap:12px;padding-top:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface);border-radius:24px 24px 0 0;margin-top:-20px;position:relative;z-index:4;box-shadow:0 -8px 24px rgba(19,40,79,.08)}
.addr{display:flex;gap:12px;align-items:flex-start;min-height:52px}
.addr .ic{width:44px;height:44px;border-radius:14px;background:var(--yellow-soft);color:var(--yellow-ink);display:flex;align-items:center;justify-content:center;flex:none}
.addr div{min-width:0}
.addr b{font-family:var(--display);font-size:19px;display:block;line-height:1.2}
.addr small{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.addr b,.addr small{transition:opacity .15s}
.addr.loading b,.addr.loading small{opacity:.35}
.kind{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row.onmap b{color:var(--navy)}
.row.onmap .ic{background:var(--yellow);border-color:var(--yellow);color:#0B4A36}
.ins input[readonly]{cursor:pointer}
.greet.tap{cursor:pointer;text-align:left}


[hidden]{display:none!important}
.radar{position:absolute;left:50%;top:50%;z-index:2;pointer-events:none}
.radar i{position:absolute;left:-60px;top:-60px;width:120px;height:120px;border-radius:50%;border:2px solid var(--navy-2);background:rgba(44,81,150,.10);animation:radar 2.4s ease-out infinite;opacity:0}
.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
@keyframes radar{0%{transform:scale(.2);opacity:.9}100%{transform:scale(1.7);opacity:0}}
.ride-sheet{gap:14px;max-height:66%}
.searchrow{display:flex;gap:14px;align-items:center}
.searchrow>div{min-width:0}
.searchrow .vi{width:62px;height:48px;border-radius:14px;background:var(--yellow-soft);display:flex;align-items:center;justify-content:center;flex:none;animation:bob .8s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-4px)}}
.searchrow h3{font-size:19px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--navy),var(--navy-2));border-radius:3px;animation:fill 4.2s linear forwards}
@keyframes fill{to{width:100%}}
.btn.ghost{background:transparent;color:var(--danger)!important;border:1.5px solid var(--line);height:48px}
.tripcard{display:flex;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface-2);border:1px solid var(--line)}
.tripcard .rail{padding-top:6px}
.tripcard .rail .l{min-height:22px}
.stops{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;font-size:14px}
.stops b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stops small{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.amt{text-align:right;flex:none}
.amt b{font-family:var(--display);font-size:21px;font-variant-numeric:tabular-nums}
.status b{font-size:17px}
.chipbtn.sos{background:#C23B3B;color:#fff;font-weight:800;letter-spacing:.08em;box-shadow:0 6px 18px rgba(194,59,59,.35)}
.chipbtn.ff{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:34px;z-index:2;font-size:12.5px}
.pinbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--yellow-soft);border-radius:16px;padding:10px 14px}
.pinbox span{font-size:13px;color:var(--yellow-ink);font-weight:600;line-height:1.3}
.pinbox b{display:flex;gap:6px;flex:none}
.pinbox i{font-style:normal;width:34px;height:40px;border-radius:10px;background:var(--surface);color:var(--fg);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;font-weight:800;box-shadow:0 2px 0 var(--line)}
.drv{display:flex;align-items:center;gap:12px}
.drv>div:not(.vehbox){flex:1;min-width:0}
.drv b{font-family:var(--display);font-size:18px;display:block}
.drv small{color:var(--muted);font-size:12.5px}
.drv .avatar{width:50px;height:50px;font-size:22px;border-radius:16px}
.vehbox{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none}
.plate{background:#FFC21A;color:#111;border:2px solid #111;border-radius:6px;padding:1px 8px;font-weight:700;font-size:13.5px;letter-spacing:.06em;white-space:nowrap}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:600}
.acts button svg{color:var(--navy)}
.modal{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(10,20,40,.45);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal .card{background:var(--surface);border-radius:24px 24px 0 0;padding-top:20px;padding-bottom:max(18px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:82%;overflow:auto;animation:in .25s}
.modal h3{font-size:20px}
.reason{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px;text-align:left;width:100%;font-weight:600}
.reason .radio{flex:none}
.reason.sel{border-color:var(--navy);background:var(--navy-soft)}
.reason.sel .radio{border:7px solid var(--navy)}
.chatlog{display:flex;flex-direction:column;gap:8px;min-height:120px;max-height:240px;overflow:auto;padding:4px 0}
.msg{max-width:78%;padding:8px 12px;border-radius:14px;font-size:14px}
.msg.me{align-self:flex-end;background:#12664A;color:#fff;border-bottom-right-radius:4px}
.msg.dr{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:4px}
.sosbig{height:64px;border-radius:18px;background:#C23B3B;color:#fff;font-family:var(--display);font-size:20px;font-weight:800;width:100%;letter-spacing:.06em}
.donehero{background:linear-gradient(170deg,var(--yellow),var(--yellow-soft));padding-top:40px;padding-bottom:24px;border-radius:0 0 32px 32px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;color:#0B4A36}
.check{width:72px;height:72px;border-radius:50%;background:#0B4A36;display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.5,.4,1)}
.bill{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid var(--line);border-radius:18px}
.bill div{display:flex;justify-content:space-between;gap:12px;font-size:14.5px;font-variant-numeric:tabular-nums}
.bill .tot{border-top:1px dashed var(--line);padding-top:10px;font-family:var(--display);font-size:20px;font-weight:700}
.qr{display:flex;gap:14px;align-items:center;padding:14px;border-radius:18px;background:var(--surface-2);border:1px solid var(--line)}
.qr svg{flex:none;border-radius:10px;background:#fff;padding:6px}
.stars{display:flex;gap:6px;justify-content:center}
.stars button{width:48px;height:48px;font-size:36px;line-height:1;color:var(--line);transition:transform .15s,color .15s}
.stars button.on{color:#F2A900;transform:scale(1.08)}
.tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip.sel{background:var(--navy-soft);border-color:var(--navy);color:var(--navy)}
textarea{width:100%;min-height:70px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;background:var(--surface);color:var(--fg);resize:vertical}


.vsvg .wh{transform-box:fill-box;transform-origin:center}
.vsvg .bd{transform-box:fill-box}
.veh .vi,.searchrow .vi{position:relative;overflow:hidden;width:68px;height:48px}
.veh .vi::after,.searchrow .vi::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:2px;background:repeating-linear-gradient(90deg,var(--muted) 0 8px,transparent 8px 14px);background-size:14px 2px;opacity:0;transition:opacity .2s}
.veh.sel .vi::after,.searchrow .vi::after{opacity:.5;animation:road .45s linear infinite}
.veh.sel .vsvg .wh,.searchrow .vsvg .wh{animation:spin .55s linear infinite}
.veh.sel .vsvg .bd,.searchrow .vsvg .bd{animation:bump .28s ease-in-out infinite alternate}
.veh:not(.sel):hover .vsvg{transform:translateX(2px);transition:transform .2s}
.searchrow .vi{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bump{to{transform:translateY(-1.2px)}}
@keyframes road{to{background-position:-14px 0}}


.fleet{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:2px 2px 6px}
.fleet::-webkit-scrollbar{display:none}
.fcard{flex:none;width:62%;max-width:240px;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px 16px 12px;border-radius:22px;border:1px solid var(--line);background:var(--surface);min-height:190px;overflow:hidden}
.fcard b{font-family:var(--display);font-size:20px;line-height:1.1}
.fcard small{color:var(--muted);font-size:13px;line-height:1.3}
.fcard.hot{background:var(--navy);border-color:var(--navy)}
.fcard.hot b,.fcard.hot small,.fcard.hot .farr{color:#fff}
.fcard.hot .fseat{background:rgba(255,255,255,.16);color:#fff}
:root[data-theme="dark"] .fcard.hot b,:root[data-theme="dark"] .fcard.hot small,:root[data-theme="dark"] .fcard.hot .farr{color:#0A1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fcard.hot b,:root:not([data-theme="light"]) .fcard.hot small,:root:not([data-theme="light"]) .fcard.hot .farr{color:#0A1712}}
.fseat{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--yellow-soft);color:var(--yellow-ink)}
.fart{margin-top:auto;align-self:flex-end;margin-right:-10px;margin-bottom:-6px;filter:drop-shadow(0 8px 6px rgba(19,40,79,.18))}
.fcard:active .fart{transform:translateX(6px);transition:transform .2s}
.fcard:hover .vsvg .wh{animation:spin .6s linear infinite}
.farr{position:absolute;left:16px;bottom:14px;font-style:normal;font-size:20px;color:var(--fg)}

.sheet>*,.body>*{flex-shrink:0}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column}
.stats b{font-family:var(--display);font-size:20px;font-variant-numeric:tabular-nums}
.stats small{color:var(--muted);font-size:12px}
.trow .tv{width:52px;background:var(--yellow-soft);border-color:transparent}
.trow .tv svg{width:46px;height:28px}
.tamt{flex:none;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.tamt b{font-family:var(--display);font-size:17px;font-variant-numeric:tabular-nums}
.tamt small{color:var(--muted);font-size:12px}
.st{font-style:normal;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px}
.st.cx{background:rgba(194,59,59,.12);color:var(--danger)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:40px 10px;color:var(--muted)}
.empty h3{color:var(--fg)}
.empty .btn{margin-top:8px;max-width:260px}
.minimap{position:relative;height:200px;border-radius:20px;overflow:hidden;border:1px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .btn:only-child{grid-column:1/-1}
.btn.wa{background:#1E8A5A;color:#fff!important;text-decoration:none;text-align:center;font-size:15px}
.receipt{background:#fff;color:#0B4A36;border-radius:18px;border:1px solid #E1E8E4;padding:18px 18px 22px;display:flex;flex-direction:column;gap:14px;position:relative;box-shadow:0 10px 30px rgba(19,40,79,.10)}
.receipt::after{content:"";position:absolute;left:10px;right:10px;bottom:-7px;height:14px;background:radial-gradient(circle at 7px 0,transparent 6px,#fff 6.5px) 0 0/14px 14px repeat-x}
.rhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding-bottom:12px;border-bottom:2px solid #FFC21A}
.rbrand{display:flex;gap:10px;align-items:center;min-width:0}
.rbrand b{font-family:var(--display);font-size:17px;display:block;line-height:1.1}
.rbrand small{font-size:11px;color:#5B6B64}
.rsign{background:#FFC21A;color:#0B4A36;font-family:var(--display);font-weight:800;font-size:13px;letter-spacing:.08em;padding:4px 8px;border-radius:8px 8px 3px 3px;border:1.5px solid #0B4A36;flex:none}
.rinv{display:flex;flex-direction:column;align-items:flex-end;text-align:right;flex:none}
.rinv b{font-size:13px;font-variant-numeric:tabular-nums}
.rinv small{font-size:11px;color:#5B6B64}
.rsec{display:flex;flex-direction:column;gap:6px;padding-bottom:12px;border-bottom:1px dashed #D3E2DA}
.rsec:last-of-type{border-bottom:0}
.rrow{display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.rrow span{color:#5B6B64;flex:none}
.rrow b{text-align:right;font-weight:600;min-width:0;font-variant-numeric:tabular-nums}
.rtot{font-family:var(--display);font-size:19px;padding-top:4px}
.rtot span{color:#0B4A36}
.rthanks{margin:0;text-align:center;font-size:13px;color:#5B6B64}
.walcard{background:#0B4A36;color:#fff;border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.walcard::before{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,216,77,.16)}
.walcard small{opacity:.75}
.walcard b{font-family:var(--display);font-size:40px;line-height:1.1;color:#FFC21A;font-variant-numeric:tabular-nums}

/* "Book" on the public website (velloretaxi.app/vellore/) opens the app as #book=<base64url JSON>:
   {f:{lat,lon,n}, t:{lat,lon,n}, v:'mini', k:'local'|'out', o:'one'|'round'}. It is kept until the customer is signed in,
   then the fare screen opens with those places. Everything in it is checked: it is just a link anyone could make. */
function readBookLink(){
  let x=null;
  try{const m=/^#book=([A-Za-z0-9_-]{10,1200})$/.exec(location.hash);
    if(m){x=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,'+').replace(/_/g,'/')))));try{sessionStorage.setItem('vct-booklink',JSON.stringify(x))}catch(e){}
      try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
    else{const s=sessionStorage.getItem('vct-booklink');if(s)x=JSON.parse(s)}}catch(e){x=null}
  const pt=p=>p&&isFinite(+p.lat)&&isFinite(+p.lon)&&+p.lat>6&&+p.lat<37&&+p.lon>68&&+p.lon<98?{lat:+p.lat,lon:+p.lon,n:String(p.n||'').replace(/[<>"'`&\\]/g,'').trim().slice(0,80)}:null;
  if(!x||!pt(x.f)||!pt(x.t))return null;
  return{f:pt(x.f),t:pt(x.t),v:/^(auto|mini|sedan|suv|psuv|trav)$/.test(x.v)?x.v:'',k:x.k==='out'?'out':'local',o:x.o==='round'?'round':'one'};
}
let BOOKLINK=readBookLink();
function useBookLink(){
  const x=BOOKLINK;BOOKLINK=null;try{sessionStorage.removeItem('vct-booklink')}catch(e){}
  [['pick',x.f],['drop',x.t]].forEach(([k,p])=>{setCustom(k,{lat:p.lat,lon:p.lon});if(p.n){P[k].ta=P[k].en=p.n}});
  S.from='pick';S.dest='drop';S.when=null;S.rider=null;S.autoFor='';
  if(x.k==='out'&&x.v!=='auto'){S.mode='out';if(x.v)OS.veh=x.v;OS.type=x.o;return outFare2()}
  S.mode='';if(x.v)S.veh=x.v;fareScreen();
}

const pinSvg=col=>`<svg width="46" height="60" viewBox="0 0 46 60" aria-hidden="true"><path d="M23 58C23 58 4 36 4 22a19 19 0 0138 0c0 14-19 36-19 36z" fill="${col}" stroke="#fff" stroke-width="3"/><circle cx="23" cy="22" r="8" fill="#FFC21A"/></svg>`;

/* Pin text: nearest landmark + area (demo; Google Maps gives real street addresses later) */
function describe(lat,lon,lang=S.lang){
  const tt=T[lang],p={lat,lon};
  let lm=null,ld=1e9;Object.keys(P).forEach(k=>{if(CUSTOM.includes(k))return;const d=hav(p,P[k]);if(d<ld){ld=d;lm=k}});
  let ar=AREAS[0],ad=1e9;AREAS.forEach(a=>{const d=hav(p,a);if(d<ad){ad=d;ar=a}});
  const fd=d=>d<1?Math.max(10,Math.round(d*100)*10)+' '+tt.m:d.toFixed(1)+' '+tt.km;
  const coords=lat.toFixed(5)+', '+lon.toFixed(5);
  if(ld<.3)return{title:lang==='ta'?`${P[lm].ta} ${tt.near}`:`${tt.near} ${P[lm].en}`,sub:`${ar[lang]} · ${coords}`};
  if(P[lm].en===ar.en)return{title:ar[lang],sub:coords};
  return{title:ar[lang],sub:(lang==='ta'?`${P[lm].ta}-${tt.from} ${fd(ld)}`:`${fd(ld)} ${tt.from} ${P[lm].en}`)+` · ${coords}`};
}
function setCustom(key,c){
  const ta=describe(c.lat,c.lon,'ta'),en=describe(c.lat,c.lon,'en');
  P[key]={ta:ta.title,en:en.title,sub:(S.lang==='ta'?ta:en).sub.replace(/\s*·?\s*-?\d+\.\d+, -?\d+\.\d+$/,''),lat:c.lat,lon:c.lon,ic:'pin'};
  ROADS=ROADS.filter(r=>!r.includes(key));
  let n=null,nd=1e9;Object.keys(P).forEach(k=>{if(CUSTOM.includes(k))return;const d=hav(c,P[k]);if(d<nd){nd=d;n=k}});

}

/* Exact-spot picker: map moves under a fixed centre pin */
function picker(mode){
  const isPick=mode==='pick';
  const start=isPick?P[S.from]:(S.dest&&P[S.dest]?P[S.dest]:{lat:P.home.lat-.006,lon:P.home.lon+.002});
  go(`<section class="screen"><div class="mapwrap" style="min-height:0"><canvas class="map" id="map"></canvas>
     <div class="topbar"><button class="chipbtn" id="bk" aria-label="Back">${I.back}</button><div class="greet"><small>${isPick?t('pickup'):t('dropLbl')}</small><b>${t(isPick?'pinPick':'pinDrop')}</b></div></div>
     <div class="hint" id="hint">${t('hint')}</div>
     <div class="pin" id="pin">${pinSvg(isPick?'#1E8A5A':'#0B4A36')}</div><i class="pinshadow"></i>
     ${zoomCtl(36)}</div>
   <div class="pickcard pad"><span class="kind">${isPick?t('pickup'):t('dropLbl')}</span>
     <div class="addr" id="addr"><span class="ic">${I.pin}</span><div><b id="at">…</b><small id="as"></small></div></div>
     <button class="btn ${isPick?'':'yellow'}" id="ok">${t(isPick?'confirmPick':'confirmDrop')}</button></div></section>`,()=>{
    const pin=document.getElementById('pin'),addr=document.getElementById('addr'),ok=document.getElementById('ok'),hint=document.getElementById('hint');
    let cur=null,touches=0;
    const show=c=>{const d=describe(c.lat,c.lon);document.getElementById('at').textContent=d.title;document.getElementById('as').textContent=d.sub.replace(/\s*·?\s*-?\d+\.\d+, -?\d+\.\d+$/,'');addr.classList.remove('loading');cur=c;ok.disabled=false;
      if(REALMAP)revGeo(c.lat,c.lon).then(g=>{if(!g||cur!==c||!document.getElementById('at'))return;c.g=g;document.getElementById('at').textContent=g[S.lang];document.getElementById('as').textContent=g.addr||g.sub||d.sub.replace(/\s*·?\s*-?\d+\.\d+, -?\d+\.\d+$/,'')})};
    const m=makeMap(document.getElementById('map'),{scale:true,hide:CUSTOM.filter(k=>!(isPick&&k==='drop'&&S.dest==='drop')),
      onStart(){pin.classList.add('lift');addr.classList.add('loading');ok.disabled=true;if(++touches>1)hint.classList.add('gone')},
      onEnd(c){pin.classList.remove('lift');show(c)}});
    m.setView(start.lat,start.lon,90000);show(m.center());
    setTimeout(()=>hint.classList.add('gone'),4500);
    bindZoom(m);
    document.getElementById('bk').onclick=search;
    ok.onclick=async()=>{if(!cur)return;ok.disabled=true;
      if(isPick){setCustom('pick',cur);await geoConfirm('pick',cur);S.from='pick';S.dest&&P[S.dest]||S.mode==='rent'&&RS.atFare?fareScreen():search();return}
      if(hav(cur,P[S.from])<.08){toast(t('tooClose'));ok.disabled=false;return}
      setCustom('drop',cur);await geoConfirm('drop',cur);S.dest='drop';fareScreen()};
  });
}

/* local: real availability from online drivers near the pickup */
const NEARKM=4; // drivers within 4 km (first 3 km, then up to 4 km)
function vAvail(v){
  if(!CL||S.when||ADV.includes(v.id))return{ok:true,eta:v.eta,live:false};
  const pu=P[S.from];const ds=NEAR.filter(n=>n.veh===v.id).map(n=>hav(n,pu)).filter(d=>d<=NEARKM);
  if(!ds.length)return{ok:false};
  return{ok:true,eta:Math.max(1,Math.round(Math.min(...ds)*1.35/20*60)+1),live:true};
}
function vehRows(r,mins){
  const VL=vlist(),av={};VL.forEach(v=>av[v.id]=vAvail(v));
  const live=VL.filter(v=>av[v.id].ok&&av[v.id].live),fast=live.length?live.reduce((a,v)=>av[v.id].eta<av[a.id].eta?v:a,live[0]).id:null;
  return VL.map(v=>{const f=fare(v,r.km),a=av[v.id];
    const sub=a.ok?`${a.eta} ${t('away')} · Drop ${timeLabel(Date.now()+(a.eta+mins)*6e4)}`:`<span class="na">${L(`இப்போ அருகில் ${v.ta} இல்லை`,`No ${v.en} nearby right now`)}</span>`;
    return `<button class="veh ${S.veh===v.id?'sel':''} ${a.ok?'':'off'}" data-v="${v.id}"><span class="vi">${I[v.id]}</span>
     <div><b>${v[S.lang]} <span class="muted" style="font-family:var(--body);font-size:13px;font-weight:600">· ${v.seats} ${t('seats')}</span></b><small>${sub}</small>${v.id===fast?`<span class="vtag">⚡ ${L('வேகமா வரும்','Fastest')}</span>`:''}</div>
     <span class="price"><b>₹${f}</b></span></button>`}).join('');
}

     ${nightNow()?`<div class="nightnote" id="nightnote">🌙 ${L(`இரவு கட்டணம் +${nightNow()}% சேர்ந்திருக்கு (${CFG.night.from}–${CFG.night.to})`,`Night charge +${nightNow()}% included (${CFG.night.from}–${CFG.night.to})`)}</div>`:''}

     ${CL?`<p class="fine muted" style="margin:0">${L('கட்டணம் தூரத்தை வைத்து. Toll, parking தனி.','Fare is by distance. Tolls and parking are extra.')}</p>`:`<p class="fine muted" style="margin:0"><button class="linkbtn" id="cp">% ${t('coupon')}</button> · ${t('fareNote')}</p>`}

      bb.disabled=!a.ok;bb.textContent=a.ok?`${S.when||ADV.includes(v.id)?L('Schedule பண்ணு','Schedule'):t('book')} ${v[S.lang]} · ₹${fare(v,r.km)}${CL&&!S.when&&S.tip0?' + ₹'+S.tip0+' tip':''}`:L(`இப்போ ${v.ta} இல்லை · வேற வண்டி தேர்வு பண்ணுங்க`,`No ${v.en} right now · pick another`)};upd();

  });
}

    document.getElementById('paid').onclick=()=>{if(R.pay==='wallet'){if(WAL.bal<PAY){toast(L('Wallet-ல போதுமான பணம் இல்லை','Not enough money in wallet'));return}walTx(-PAY,`Ride: ${R.destName.ta}`,`Ride: ${R.destName.en}`)}document.getElementById('paybox').hidden=true;rate.hidden=false;rate.style.display='flex';document.getElementById('db').scrollTop=0};

/* ================= STEP 3: trips history, bill / PDF, wallet ================= */
let WAL={bal:50,tx:[{amt:50,ta:'வரவேற்பு bonus',en:'Welcome bonus',date:Date.now()}]};
try{const w=JSON.parse(localStorage.getItem('vct_wallet')||'null');if(w&&typeof w.bal==='number')WAL=w}catch(e){}
function saveWal(){try{localStorage.setItem('vct_wallet',JSON.stringify(WAL))}catch(e){}}
function walTx(amt,ta,en){WAL.bal+=amt;WAL.tx.unshift({amt,ta,en,date:Date.now()});saveWal()}
const inr=n=>'₹'+Number(n).toLocaleString('en-IN');

function recordTrip(status,x={}){
  if(!R.drv)R.drv={ta:'',en:'',plate:'',model:''};
  const id=Date.now().toString(36).toUpperCase();
  TRIPS.unshift({id,status,from:R.fromName,to:R.destName,fromKey:R.from,destKey:R.dest,
    fromC:{lat:P[R.from].lat,lon:P[R.from].lon},toC:{lat:P[R.dest].lat,lon:P[R.dest].lon},path:R.trip,
    veh:{ta:R.v.ta,en:R.v.en,id:R.v.id},km:+R.km.toFixed(1),base:R.v.base,fare:R.fare,tip:(x.tip||0)+(R.boost||0),pay:R.pay,date:Date.now(),
    stars:x.stars||0,driver:{ta:R.drv.ta,en:R.drv.en},plate:R.drv.plate,model:R.drv.model,reason:x.reason||'',phase:R.phase});
  saveTrips();
}
const invNo=x=>{const d=new Date(x.date);return `VCT-${String(d.getFullYear()).slice(2)}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}-${(x.id||String(x.date)).slice(-4)}`};
const payName=p=>p==='upi'?t('payUpi'):p==='wallet'?'Wallet':t('payCash');
const total=x=>(x.fare||0)+(x.tip||0);

/* ---------- Trips tab ---------- */
let tripFilter='all';
function tripsTab(){
  const list=TRIPS.filter(x=>tripFilter==='all'||(tripFilter==='done'?isDone(x):tripFilter==='up'?x.status==='upcoming':x.status==='cancelled'));
  const done=TRIPS.filter(isDone);
  const spent=done.reduce((a,x)=>a+total(x),0),km=done.reduce((a,x)=>a+(x.km||0),0);
  go(shell(`<div class="head pad"><h2>${t('trips')}</h2></div>
   <div class="body pad" style="padding-top:4px">
    ${TRIPS.length?`<div class="stats"><div><b>${done.length}</b><small>${L('பயணங்கள்','Rides')}</small></div><div><b>${km.toFixed(1)}</b><small>${L('கி.மீ','km')}</small></div><div><b>${inr(spent)}</b><small>${L('செலவு','Spent')}</small></div></div>
    <div class="chips">${[['all',L('எல்லாம்','All')],['up',L('வரவிருக்கும்','Upcoming')],['done',L('முடிந்தவை','Completed')],['cx',L('ரத்து','Cancelled')]].map(([k,l])=>`<button class="chip ${tripFilter===k?'sel':''}" data-f="${k}">${l}</button>`).join('')}</div>`:''}
    ${list.length?`<div class="recent">${list.map(x=>`<button class="row trow" data-id="${x.id||''}" data-date="${x.date}">
        <span class="ic tv">${I[(x.veh&&x.veh.id)||'auto']||I.clock}</span>
        <div><b>${x.to[S.lang]}</b><small>${L('இருந்து','From')}: ${x.from[S.lang]} · ${when(x.date)}</small></div>
        <span class="tamt">${x.status==='upcoming'?`<em class="st up">${fmtWhen(x.when)}</em><small>${kindName(x.kind)} · ${inr(x.fare)}</small>`:x.status==='cancelled'?`<em class="st cx">${L('ரத்து','Cancelled')}</em>`:`<b>${inr(total(x))}</b><small>${x.veh[S.lang]}</small>`}</span></button>`).join('')}</div>`
     :`<div class="empty">${I.navTrips.replace('<svg ','<svg width="56" height="56" ')}<h3>${TRIPS.length?L('இந்த பிரிவுல பயணம் இல்லை','No rides here'):L('இன்னும் பயணம் இல்லை','No rides yet')}</h3>
        <p class="muted">${L('உங்க முதல் ride-ஐ book பண்ணுங்க. எல்லா பயணமும் bill-ஓட இங்கே சேமிக்கப்படும்.','Book your first ride. Every trip is saved here with its bill.')}</p><button class="btn yellow" id="bk1">${t('where')}</button></div>`}
   </div>`),()=>{
    bindNav();
    app.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{tripFilter=b.dataset.f;tripsTab()});
    app.querySelectorAll('.trow').forEach(b=>b.onclick=()=>{const x=TRIPS.find(x=>(x.id||'')===b.dataset.id&&String(x.date)===b.dataset.date);x&&x.status==='upcoming'?upcomingDetail(x):tripDetail(x)});
    const b1=document.getElementById('bk1');if(b1)b1.onclick=search;
  });
}

function tripDetail(x){
  if(!x)return tripsTab();
  const cx=x.status==='cancelled',hasMap=x.path&&x.path.length>1;
  go(`<section class="screen"><div class="head pad"><button class="back" id="bk" aria-label="Back">${I.back}</button><h2>${cx?L('ரத்தான பயணம்','Cancelled ride'):L('பயண விவரம்','Ride details')}</h2><span class="muted" style="font-size:12.5px">${invNo(x)}</span></div>
   <div class="body pad" style="padding-top:0">
    ${hasMap?`<div class="minimap"><canvas class="map" id="map"></canvas></div>`:''}
    <div class="tripcard"><div class="rail"><i class="a"></i><i class="l"></i><i class="b"></i></div>
      <div class="stops"><div><small>${t('pickup')}</small><b>${x.from[S.lang]}</b></div><div><small>${t('dropLbl')}</small><b>${x.to[S.lang]}</b></div></div>
      <div class="amt"><b>${cx?'₹0':inr(total(x))}</b><br><small class="muted">${when(x.date)}</small></div></div>
    ${x.plate?`<div class="drv"><span class="avatar">${x.driver.en[0]}</span><div><b>${x.driver[S.lang]}</b><small>${x.veh[S.lang]} · ${x.model||''}</small></div><div class="vehbox"><span class="plate">${x.plate}</span>${x.stars?`<small style="color:#F2A900;letter-spacing:1px">${'★'.repeat(x.stars)}</small>`:''}</div></div>`:''}
    ${cx?`<div class="note">${L('காரணம்','Reason')}: ${x.reason||'—'} · ${L('கட்டணம் இல்லை','No charge')}</div>`
      :`<div class="bill">${x.base!=null?`<div><span>${L('அடிப்படை கட்டணம்','Base fare')}</span><span>${inr(x.base)}</span></div><div><span>${L(`தூரம் (${x.km} கி.மீ)`,`Distance (${x.km} km)`)}</span><span>${inr(x.fare-x.base)}</span></div>`:''}
        ${x.tip?`<div><span>${L('Driver tip','Driver tip')}</span><span>${inr(x.tip)}</span></div>`:''}
        <div class="tot"><span>${L('மொத்தம்','Total')}</span><span>${inr(total(x))}</span></div><div><span class="muted">${L('பணம்','Paid by')}</span><span>${payName(x.pay)}</span></div></div>`}
    <div class="two">${cx?'':`<button class="btn" id="bill">${L('Bill பார்','View bill')}</button>`}<button class="btn yellow" id="again">${L('மறுபடி Book','Book again')}</button></div>
    <button class="linkbtn" id="hlp" style="align-self:center">${L('இந்த பயணத்தில் பிரச்சனையா?','Problem with this ride?')}</button>
   </div></section>`,()=>{
    if(hasMap){const m=makeMap(document.getElementById('map'),{line:()=>x.path,hide:CUSTOM,pins:[{...x.fromC,col:'#1E8A5A'},{...x.toC,col:'#121212'}]});m.fit(x.path,36,0)}
    document.getElementById('bk').onclick=tripsTab;
    const bl=document.getElementById('bill');if(bl)bl.onclick=()=>receipt(x);
    document.getElementById('again').onclick=()=>rebook(x);
    document.getElementById('hlp').onclick=()=>issueSheet(x);
  });
}
function rebook(x){
  S.mode='';
  if(x.fromKey&&P[x.fromKey]&&!CUSTOM.includes(x.fromKey))S.from=x.fromKey;else if(x.fromC){setCustom('pick',x.fromC);S.from='pick'}else S.from='home';
  if(x.destKey&&P[x.destKey]&&!CUSTOM.includes(x.destKey))S.dest=x.destKey;else if(x.toC){setCustom('drop',x.toC);S.dest='drop'}else return search();
  if(x.veh&&x.veh.id&&VEH.some(v=>v.id===x.veh.id))S.veh=x.veh.id;
  fareScreen();
}

/* ---------- Bill / receipt ---------- */

   <div class="body pad" style="padding-top:0">

      <p class="rthanks">${L('Vellore Taxi-ஐ தேர்ந்தெடுத்ததற்கு நன்றி!','Thank you for riding with Vellore Taxi!')}</p>
    </div>
    <div class="two"><button class="btn" id="pdf">${L('PDF Download','Download PDF')}</button>
      <a class="btn wa" href="https://wa.me/?text=${encodeURIComponent(waTxt)}" target="_blank" rel="noopener">${L('WhatsApp-ல அனுப்பு','Send on WhatsApp')}</a></div>
   </div></section>`,()=>{

const timeLabel=ts=>new Date(ts).toLocaleTimeString(S.lang==='ta'?'ta-IN':'en-IN',{hour:'numeric',minute:'2-digit'});

/* ---------- modern date & time picker (shared by Schedule, Local later, Rental, Outstation) ---------- */
const TPP=[['dawn','🌙','அதிகாலை','Early',0,6],['morn','🌅','காலை','Morning',6,12],['noon','☀️','மதியம்','Afternoon',12,17],['eve','🌆','மாலை','Evening',17,20],['night','🌃','இரவு','Night',20,24]];
const d0=t=>{const x=new Date(t);x.setHours(0,0,0,0);return x.getTime()};
const tpLong=ts=>`${dayLabel(ts)} · ${new Date(ts).toLocaleDateString(S.lang==='ta'?'ta-IN':'en-IN',{day:'numeric',month:'short'})} · ${timeLabel(ts)}`;
function tpRender(box,o){ // o:{min,max,val,onChange}
  const min=o.min,max=o.max||min+60*864e5;
  if(!o.val||o.val<min)o.val=min;if(o.val>max)o.val=max;
  const slotsOf=(day,a,b)=>{const out=[];for(let m=a*60;m<b*60;m+=15){const t=day+m*6e4;if(t>=min&&t<=max)out.push(t)}return out};
  const days=[];for(let d=d0(min);d<=d0(max);d+=864e5){if(slotsOf(d,0,24).length)days.push(d);if(days.length>=60)break}
  let day=d0(o.val);if(!days.includes(day))day=days[0];
  const hr=new Date(o.val).getHours();let per=(TPP.find(p=>hr>=p[4]&&hr<p[5])||TPP[1])[0];
  const draw=()=>{
    const P=TPP.map(p=>({p,n:slotsOf(day,p[4],p[5])}));if(!P.find(x=>x.p[0]===per&&x.n.length))per=(P.find(x=>x.n.length)||P[0]).p[0];
    const cur=P.find(x=>x.p[0]===per),now=Date.now();
    const quick=day===d0(now)?[[30,L('30 நிமி-ல','In 30 min')],[60,L('1 மணி-ல','In 1 hr')],[120,L('2 மணி-ல','In 2 hrs')]].map(([m,l])=>[Math.ceil((now+m*6e4)/9e5)*9e5,l]).filter(([t])=>t>=min&&t<=max):[];
    box.innerHTML=`<div class="tpsum"><span>🗓️</span><b>${tpLong(o.val)}</b></div>
     <div class="tpdays">${days.map(d=>{const dt=new Date(d);return `<button class="${d===day?'on':''}" data-tpd="${d}"><small>${d===d0(now)?L('இன்று','Today'):d===d0(now)+864e5?L('நாளை','Tmrw'):dt.toLocaleDateString(S.lang==='ta'?'ta-IN':'en-IN',{weekday:'short'})}</small><b>${dt.getDate()}</b><small>${dt.toLocaleDateString(S.lang==='ta'?'ta-IN':'en-IN',{month:'short'})}</small></button>`}).join('')}</div>
     ${quick.length?`<div class="tpquick">${quick.map(([t,l])=>`<button class="${t===o.val?'on':''}" data-tpt="${t}">⚡ ${l}</button>`).join('')}</div>`:''}
     <div class="tpper">${P.map(({p,n})=>`<button class="${p[0]===per?'on':''}" data-tpp="${p[0]}" ${n.length?'':'disabled'}><span>${p[1]}</span>${S.lang==='ta'?p[2]:p[3]}</button>`).join('')}</div>
     <div class="tpgrid">${cur.n.map(t=>`<button class="${t===o.val?'on':''}" data-tpt="${t}">${timeLabel(t)}</button>`).join('')||`<p class="muted" style="grid-column:1/-1;margin:6px 0">${L('இந்த நேரத்துல slot இல்லை','No slots in this part of the day')}</p>`}</div>`;
    box.querySelectorAll('[data-tpd]').forEach(b=>b.onclick=()=>{day=+b.dataset.tpd;const keep=new Date(o.val);let nv=day+(keep.getHours()*60+keep.getMinutes())*6e4;if(nv<min)nv=slotsOf(day,0,24)[0];if(nv>max)nv=slotsOf(day,0,24).slice(-1)[0];o.val=nv;const h=new Date(nv).getHours();per=(TPP.find(p=>h>=p[4]&&h<p[5])||TPP[1])[0];o.onChange&&o.onChange(o.val);draw()});
    box.querySelectorAll('[data-tpp]').forEach(b=>b.onclick=()=>{per=b.dataset.tpp;const n=slotsOf(day,...TPP.find(p=>p[0]===per).slice(4));if(n.length&&!n.includes(o.val)){o.val=n[0];o.onChange&&o.onChange(o.val)}draw()});
    box.querySelectorAll('[data-tpt]').forEach(b=>b.onclick=()=>{o.val=+b.dataset.tpt;day=d0(o.val);const h=new Date(o.val).getHours();per=(TPP.find(p=>h>=p[4]&&h<p[5])||TPP[1])[0];o.onChange&&o.onChange(o.val);draw()});
    const sel=box.querySelector('.tpdays .on');if(sel)sel.scrollIntoView({inline:'center',block:'nearest'});
  };
  draw();
}

const PKG=[{h:1,km:10},{h:2,km:20},{h:3,km:30},{h:4,km:40},{h:5,km:50},{h:6,km:60},{h:8,km:80},{h:10,km:100},{h:12,km:120}];
const RANCH=[1,2,4,8,12];
const RENT={auto:[199,379,null,null,null],mini:[299,549,999,1799,2599],sedan:[349,649,1149,2099,2999],suv:[499,899,1599,2799,3999],psuv:[699,1199,2099,3599,4999],trav:[null,null,2499,3999,5499]};
const XKM={auto:14,mini:12,sedan:13,suv:17,psuv:21,trav:24},XHR={auto:120,mini:150,sedan:170,suv:230,psuv:290,trav:350};
const RS={pkg:3,veh:'sedan',when:null,atFare:false};
const pkLbl=p=>`${p.h} ${L('மணி','hr'+(p.h>1?'s':''))} · ${p.km} ${t('km')}`;
function rentPrice(id,h){const row=RENT[id];if(!row)return null;
  const pts=RANCH.map((x,i)=>[x,row[i]]).filter(x=>x[1]!=null);if(!pts.length||h<pts[0][0]||h>pts[pts.length-1][0])return null;
  for(let i=0;i<pts.length;i++){if(pts[i][0]===h)return pts[i][1];if(pts[i][0]>h){const[a,pa]=pts[i-1],[b,pb]=pts[i];return Math.round((pa+(pb-pa)*(h-a)/(b-a))/50)*50-1}}return null}
const rentVeh=()=>VEH.filter(v=>RENT[v.id]);
function rentFrom(i){const ps=rentVeh().map(v=>rentPrice(v.id,PKG[i].h)).filter(x=>x!=null);return ps.length?Math.min(...ps):null}

const TNUM={'ஒன்று':1,'ஒரு':1,'ஒண்ணு':1,'இரண்டு':2,'ரெண்டு':2,'மூன்று':3,'மூணு':3,'நான்கு':4,'நாலு':4,'ஐந்து':5,'அஞ்சு':5,'ஆறு':6,'ஏழு':7,'எட்டு':8,'ஒன்பது':9,'பத்து':10,'பதினொன்று':11,'பதினொரு':11,'பன்னிரண்டு':12};
function parseVoice(raw){
  let s=' '+(raw||'').toLowerCase().replace(/[.,!?]/g,' ')+' ';const out={};
  const pick=list=>{for(const [id,ws] of list){const w=ws.find(w=>s.includes(w));if(w){s=s.replace(w,' ');return id}}return null};
  out.veh=pick([['trav',['mini bus','minibus','மினி பஸ்','மினிபஸ்','maxi cab','maxi','மேக்ஸி']],['trav',['traveller','traveler','tempo','டிராவலர்','டெம்போ','வேன்',' van ']],
    ['psuv',['innova','crysta','hycross','இன்னோவா','premium','பிரீமியம்','premium mpv']],['suv',['mpv','suv','ertiga','எர்டிகா','7 seater','seven seater','எஸ்யூவி']],['sedan',['sedan','dzire','செடான்','கார்',' car ']],['mini',['mini','மினி','swift','wagon']],
    ['auto',['auto','ஆட்டோ']],['bike',['bike','பைக்']]]);
  const ci=CITIES.findIndex(c=>s.includes(c.en.toLowerCase())||s.includes(c.ta));if(ci>=0)out.city=ci;
  out.dest=pick([['oldbus',['old bus','பழைய பஸ்','பழைய பேருந்து']],['newbus',['new bus','bus stand','busstand','பஸ் ஸ்டாண்ட்','பேருந்து நிலைய','புது பஸ்']],
    ['cmc',['cmc','சிஎம்சி','hospital','ஆஸ்பத்திரி','மருத்துவமனை']],['katpadi',['station','railway','junction','ஸ்டேஷன்','ஜங்ஷன்','ரயில்','katpadi','காட்பாடி']],
    ['vit',['vit','விஐடி','வி.ஐ.டி','university']],['fort',['fort','கோட்டை','jalakandeswarar']],['golden',['golden','sripuram','ஸ்ரீபுரம்','தங்க']],
    ['sathu',['sathuvachari','சத்துவாச்சாரி']],['bagayam',['bagayam','பாகாயம்']],['home',['வீட்டுக்கு',' home ','gandhi nagar','காந்தி நகர்']]]);
  Object.entries(TNUM).forEach(([w,n])=>{s=s.replace(new RegExp(w+'\\s*மணி','g'),n+' மணி')});
  let day=/நாளன்னைக்கு|நாளை மறுநாள்|day after/.test(s)?2:/நாளை|tomorrow/.test(s)?1:0;
  const pmW=/pm|மாலை|சாயங்காலம்|இரவு|ராத்திரி|evening|night|afternoon|மதியம்/.test(s),amW=/am|காலை|morning/.test(s);
  const m=s.match(/(\d{1,2})(?:[:.](\d{2}))?\s*(am|pm|மணி|o'?clock)?/);
  if(m&&(m[3]||pmW||amW)&&+m[1]<24){
    let h=+m[1];const mi=+(m[2]||0);if(pmW&&h<12)h+=12;
    const d=dayStart(day);d.setHours(h,mi);let ts=d.getTime();
    if(!pmW&&!amW&&!day&&h<12&&ts<Date.now()+20*6e4)ts+=12*36e5;
    if(!day&&ts<Date.now()+20*6e4)ts+=24*36e5;
    out.when=ts;
  }else if(day){const d=dayStart(day);d.setHours(9,0);out.when=d.getTime()}
  return out;
}

      if(!SR){vs.textContent=L('இந்த browser-ல voice வசதி இல்லை. கீழே type பண்ணுங்க','Voice isn’t available in this browser. Type below');return}
      try{rec=new SR();rec.lang=S.lang==='ta'?'ta-IN':'en-IN';rec.interimResults=true;

        rec.onend=()=>{vm.classList.remove('on');if(vs.textContent===T1)vs.textContent=T0};
        rec.start();vm.classList.add('on');vs.textContent=T1}
      catch(e){vm.classList.remove('on');vs.textContent=L('Mic திறக்க முடியல. கீழே type பண்ணுங்க','Couldn’t open the mic. Type below')}};
    vm.onclick=()=>{if(vm.classList.contains('on')&&rec){try{rec.stop()}catch(e){}return}listen()};
    vgo.onclick=()=>{if(rec)try{rec.abort()}catch(e){}close();applyVoice(parsed)};
    listen();
  });
}
function applyVoice(p){

  search();
}

function callbackSheet(reason){
  const RS2=S.lang==='ta'?['Booking உதவி','கட்டணம் / பணம்','Complaint','பொருள் மறந்தது','வேற']:['Booking help','Fare / payment','Complaint','Lost item','Other'];
  const WH=S.lang==='ta'?['இப்போவே','30 நிமிடத்தில்','மாலை 6–8']:['Right now','In 30 minutes','6–8 pm'];
  let r=reason!=null?reason:0,w=0;
  modal(`<h3>Call me back</h3><p class="muted" style="margin:0">${L('எங்க staff உங்களை கூப்பிடுவாங்க. உங்களுக்கு call charge இல்லை.','Our staff will call you. The call is free for you.')}</p>
    <span class="kind">${L('எதைப் பற்றி?','What is it about?')}</span>
    <div class="tags" style="justify-content:flex-start">${RS2.map((x,i)=>`<button class="chip ${i===r?'sel':''}" data-r="${i}">${x}</button>`).join('')}</div>
    <span class="kind">${L('எப்போ கூப்பிடலாம்?','When should we call?')}</span>
    <div class="tags" style="justify-content:flex-start">${WH.map((x,i)=>`<button class="chip ${i===0?'sel':''}" data-w="${i}">${x}</button>`).join('')}</div>
    <div class="field" style="height:52px"><span class="cc">+91</span><input id="cbp" inputmode="numeric" maxlength="10" value="${esc(S.phone||'')}" aria-label="Phone"></div>
    <textarea id="cbn" maxlength="300" placeholder="${L('சுருக்கமா சொல்லுங்க (விருப்பம்)','Tell us briefly (optional)')}"></textarea>
    <div class="err" id="cbe"></div><button class="btn" id="cbs">${L('Request அனுப்பு','Send request')}</button>`,(m,close)=>{
    m.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{r=+b.dataset.r;m.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('sel',x===b))});
    m.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{w=+b.dataset.w;m.querySelectorAll('[data-w]').forEach(x=>x.classList.toggle('sel',x===b))});
    const ph=m.querySelector('#cbp');ph.oninput=()=>{ph.value=ph.value.replace(/\D/g,'').slice(0,10)};
    m.querySelector('#cbs').onclick=()=>{
      if(!/^[6-9]\d{9}$/.test(ph.value)){m.querySelector('#cbe').textContent=t('phoneErr');return}
      const RS3=[['Booking உதவி','Booking help'],['கட்டணம் / பணம்','Fare / payment'],['Complaint','Complaint'],['பொருள் மறந்தது','Lost item'],['வேற','Other']];
      const WH3=[['இப்போவே','Right now'],['30 நிமிடத்தில்','In 30 minutes'],['மாலை 6–8','6–8 pm']];
      addTicket({type:'callback',title:{ta:`${RS3[r][0]} · ${WH3[w][0]}`,en:`${RS3[r][1]} · ${WH3[w][1]}`},phone:ph.value,note:m.querySelector('#cbn').value.trim()});
      close();if(S.tab==='help')helpTab();
      toast(L(`Request அனுப்பியாச்சு. Staff +91 ${ph.value}-க்கு கூப்பிடுவாங்க`,`Request sent. Our staff will call +91 ${ph.value}`));
    };
  });
}

function issueSheet(x,preset){
  if(!x){callbackSheet(2);return}
  let k=preset||'fare',photo=null;
  modal(`<h3>${L('என்ன பிரச்சனை?','What went wrong?')}</h3><p class="muted" style="margin:0;font-size:13px">${x.to[S.lang]} · ${when(x.date)} · ${invNo(x)}</p>
    <div style="display:flex;flex-direction:column;gap:8px">${ISSUES.map(([id,ta,en])=>`<button class="reason ${id===k?'sel':''}" data-k="${id}"><i class="radio"></i>${S.lang==='ta'?ta:en}</button>`).join('')}</div>
    <div class="field" id="lostf" style="height:52px" ${k==='lost'?'':'hidden'}><input id="lostw" maxlength="60" placeholder="${L('என்ன பொருள்? (உதா: கருப்பு bag, phone)','What item? (e.g. black bag, phone)')}"></div>
    <textarea id="isn" maxlength="400" placeholder="${L('என்ன நடந்ததுன்னு சொல்லுங்க','Tell us what happened')}"></textarea>
    <label class="photo" for="isp"><span id="ispl">${L('+ Photo சேர் (விருப்பம்)','+ Add a photo (optional)')}</span><input id="isp" type="file" accept="image/*" hidden></label>
    <div class="err" id="ise"></div><button class="btn" id="iss">${L('Complaint அனுப்பு','Send complaint')}</button>`,(m,close)=>{
    m.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{k=b.dataset.k;m.querySelectorAll('[data-k]').forEach(y=>y.classList.toggle('sel',y===b));m.querySelector('#lostf').hidden=k!=='lost';
      m.querySelector('#iss').textContent=k==='lost'?L('Report அனுப்பு','Send report'):L('Complaint அனுப்பு','Send complaint')});
    m.querySelector('#isp').onchange=e=>{const f=e.target.files[0];if(f){photo=f.name;m.querySelector('#ispl').textContent='✓ '+f.name}};
    m.querySelector('#iss').onclick=()=>{
      const item=m.querySelector('#lostw').value.trim(),note=m.querySelector('#isn').value.trim();
      if(k==='lost'&&!item){m.querySelector('#ise').textContent=L('என்ன பொருள்னு சொல்லுங்க','Tell us which item');return}
      if(k==='other'&&!note){m.querySelector('#ise').textContent=L('என்ன நடந்ததுன்னு கொஞ்சம் சொல்லுங்க','Please describe what happened');return}
      const is=ISSUES.find(i=>i[0]===k);
      const tk=addTicket({type:k==='lost'?'lost':'complaint',trip:invNo(x),title:{ta:k==='lost'?`${is[1]}: ${item}`:is[1],en:k==='lost'?`${is[2]}: ${item}`:is[2]},note,photo});
      close();toast(L(`${tk.id} பதிவாச்சு. Staff பார்த்து உங்களை கூப்பிடுவாங்க`,`${tk.id} logged. Our staff will look into it and call you`));
    };
  });
}

    <div class="field" style="height:52px"><input id="ecn" maxlength="30" placeholder="${L('பெயர்','Name')}" autocomplete="off"></div>

  });

/* ================= CLOUD: Firebase (live on GitHub Pages; demo everywhere else) ================= */
let CL=null,CUID=null,BKUNSUB=null,LIVEUNSUB=null,CFGUNSUB=null;
const CFG={upi:'',office:'',comm:10};
const ON_PAGES=!/^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
const cloudP=(window.CLOUD_READY||Promise.resolve(null)).then(c=>{CL=c||null;return CL}).catch(()=>null);
const F=()=>CL.fs;
const placeOf=k=>({key:CUSTOM.includes(k)?null:k,ta:P[k].ta,en:P[k].en,lat:P[k].lat,lon:P[k].lon,addr:String(P[k].addr||'').slice(0,240)});
function offlineScreen(){
  go(`<section class="screen"><div class="hero pad"><span class="mini">VCT · VELLORE TAXI</span><h1>${L('Internet இல்லை','You are offline')}</h1><p>${L('Connection-ஐ பார்த்துட்டு மறுபடி முயற்சி பண்ணுங்க.','Check your connection and try again.')}</p></div>
   <div class="body pad"><div style="flex:1"></div><button class="btn" id="rl">${L('மறுபடி முயற்சி','Try again')}</button></div></section>`,()=>document.getElementById('rl').onclick=()=>location.reload());
}
async function cloudBoot(){
  const c=await cloudP;
  if(!c){if(ON_PAGES){await SPLASH_MIN;offlineScreen();return true}return false}
  const u=await CL.waitUser();
  await SPLASH_MIN;
  if(!u){S.logged=false;save();langScreen();return true}
  // same person as last time, name and number already on this phone → open home now, refresh the profile in the background
  const fast=S.logged&&!!S.uid&&S.uid===u.uid&&!!S.name&&/^[6-9]\d{9}$/.test(S.phone)&&(!u.phoneNumber||u.phoneNumber==='+91'+S.phone);
  CUID=u.uid;S.uid=u.uid;if(u.phoneNumber)S.phone=u.phoneNumber.replace('+91','');else if(!fast)S.phone='';
  if(fast)loadProfile().then(()=>{if(S.name)save()});else await loadProfile();
  watchConfig();
  if(!S.name||!/^[6-9]\d{9}$/.test(S.phone)){nameScreen();return true}
  S.logged=true;save();await mapsWait();resumeActive()||home();return true;
}
async function loadProfile(){
  try{const s=await F().getDoc(F().doc(CL.db,'users',CUID));if(!s.exists()||!s.data().joinedAt)F().setDoc(F().doc(CL.db,'users',CUID),{joinedAt:F().serverTimestamp()},{merge:true}).catch(()=>{});if(s.exists()){const d=s.data();if(d.name)S.name=d.name;if(!CL.user.phoneNumber&&d.phone)S.phone=String(d.phone).replace('+91','');if(Array.isArray(d.ec)){EC=d.ec;saveEc()}}}catch(e){}
}
function saveProfile(extra={}){if(!CL||!CUID)return;F().setDoc(F().doc(CL.db,'users',CUID),{name:S.name,phone:'+91'+S.phone,ec:EC,updatedAt:F().serverTimestamp(),...extra},{merge:true}).catch(()=>{})}
function watchConfig(){
  if(CFGUNSUB)return;
  CFGUNSUB=F().onSnapshot(F().doc(CL.db,'config','app'),s=>{if(!s.exists())return;const d=s.data();
    if(d.fares)VEH.forEach(v=>{const f=d.fares[v.id];if(f&&v.id!=='auto'){if(f.base!=null)v.base=+f.base;if(f.per!=null)v.per=+f.per}});
    CFG.area=d.area||null;CFG.upi=d.upi||'';CFG.office=d.office||'';CFG.push=d.push||null;CFG.night=d.night||null;CFG.privPhone=!!d.privPhone;CFG.serverPin=!!d.serverPin;CFG.comm=d.comm!=null?+d.comm:10;CFG.wait=d.wait||null;CFG.blocked=Array.isArray(d.blocked)?d.blocked:[];{const had=VEH.includes(BIKE);setBike(!!d.showBike);if(had!==VEH.includes(BIKE)&&S.tab==='home'&&document.querySelector('.vrow')&&!document.querySelector('.modal'))home(S.mode||undefined)}if(d.dispatch)Object.assign(DISPC,d.dispatch);applyTariff(d);
    // refresh the browser push token last: Android WebView has no window.Notification (the app uses native push),
    // and reading it there used to throw before the outstation prices and settings above were applied
    try{if(CUID&&!NATIVEC()&&pushReadyC()&&typeof Notification!=='undefined'&&Notification.permission==='granted')enablePushC(false)}catch(e){}},()=>{});
  F().getDoc(F().doc(CL.db,'blocked','+91'+S.phone)).then(x=>{MEBLK=x.exists()}).catch(()=>{}); // only my own entry is readable
  watchWx();
  if(CUID)VCTCLK.sync(F(),F().doc(CL.db,'users',CUID)); // learn the server time once
  watchMyB();
}
/* small weather line on home (config/weather, refreshed by the server every 30 minutes) */
let WXD=null,WXUNSUB=null;
function wxHtml(){return CL?VCTWX.html(WXD,Date.now(),'customer',S.lang):''}
function watchWx(){if(WXUNSUB||!CL)return;
  WXUNSUB=F().onSnapshot(F().doc(CL.db,'config','weather'),s=>{WXD=s.exists()?s.data():null;const el=document.getElementById('wx');if(el)el.outerHTML=wxHtml()},()=>{})}
function resumeActive(){
  let a=null;try{a=JSON.parse(localStorage.getItem('vct_ride')||'null')}catch(e){}
  if(!a||!a.id)return false;
  F().getDoc(F().doc(CL.db,'bookings',a.id)).then(s=>{if(!s.exists())return;const b=s.data();if(!['searching','assigned','ontrip'].includes(b.status)){forgetRide();return}
    const v=VEH.find(x=>x.id===b.veh)||BIKE.id===b.veh&&BIKE||VEH.find(x=>x.id==='auto');
    R={id:a.id,v,km:b.km,path:[],fare:b.fare,pay:b.pay,from:'pick',dest:'drop',fromName:{ta:b.from.ta,en:b.from.en},destName:{ta:b.to.ta,en:b.to.en},
       pin:a.pin,trackId:a.id.slice(0,8),trip:b.path||[b.from,b.to],phase:'search',chat:[],drv:null,dpos:null,b,t0:+b.when||CL.toMs(b.createdAt)||Date.now()};
    P.pick={...b.from,ic:'pin'};P.drop={...b.to,ic:'pin'};
    watchBooking();
  }).catch(()=>{});
  return false;
}
const rememberRide=()=>{try{localStorage.setItem('vct_ride',JSON.stringify({id:R.id,pin:R.pin}))}catch(e){}};
const forgetRide=()=>{try{localStorage.removeItem('vct_ride')}catch(e){}};

/* driver cancelled a local ride → book again at once with the same details; that driver won't get it again */
async function autoRebook(b){
  stopWatch();const old=R.id,ex=[...(b.exclude||[]),b.driverPhone].filter(Boolean);
  const data={};['customerUid','custName','custPhone','src','kind','from','to','path','veh','vehTa','vehEn','km','base','fare','pay','tip','rider','tariff'].forEach(k=>{if(b[k]!==undefined)data[k]=b[k]});
  Object.assign(data,{status:'searching',when:VCTCLK.now(),exclude:ex,rebookOf:old,createdAt:F().serverTimestamp(),updatedAt:F().serverTimestamp()});
  let ct=null;try{const cs=await F().getDoc(F().doc(CL.db,'bookings',old,'private','contact'));if(cs.exists())ct=cs.data()}catch(e){}
  const ct2=takeContact(data);if(!ct)ct=ct2;
  const pin=String(1000+Math.floor(Math.random()*9000));
  try{if(!CFG.serverPin)try{Object.assign(data,await VCTPIN.fields(pin))}catch(e){} // lets the driver check the PIN even if this phone goes offline
    const ref=await F().addDoc(F().collection(CL.db,'bookings'),data);await F().setDoc(F().doc(CL.db,'bookings',ref.id,'private','pin'),{pin});
    await saveContact(ref.id,ct);
    Object.assign(R,{id:ref.id,pin,trackId:ref.id.slice(0,8),phase:'search',drv:null,dpos:null,b:data,riderPh:ct.riderPhone,t0:Date.now(),rebookN:(R.rebookN||0)+1,rebooked:true,lastTry:null});
    rememberRide();watchBooking();
    toast(L('உங்க driver ரத்து செஞ்சார். மன்னிக்கவும் — வேற driver-ஐ தேடுறோம்','Your driver cancelled. Sorry — finding you another driver'));
  }catch(e){toast(CL.errText(e,S.lang==='ta'));forgetRide();recordTrip('cancelled',{reason:b.cancelReason||''});R=null;home()}
}
/* phone numbers are kept out of the booking (nearby drivers can read a waiting booking) and saved in
   bookings/{id}/private/contact, which only the office, this customer and the driver who accepted can read */
function takeContact(d){const c={custPhone:d.custPhone||null,riderPhone:d.rider&&d.rider.phone?String(d.rider.phone):null};
  if(!CFG.privPhone)return c; // switched on by the owner after the new security rules are published (office → Settings)
  delete d.custPhone;if(d.rider)d.rider={name:String(d.rider.name||'')};return c}
const saveContact=(id,c)=>F().setDoc(F().doc(CL.db,'bookings',id,'private','contact'),c);
function localTar(v,km){const w=CFG.wait||{},np=nightV(v),o={t:'local',wait:v&&v.id==='auto'?FARE.AUTO_GOVT.wait:+w.rate||0,free:w.free!=null?+w.free:3};if(v&&v.id==='auto')o.govt='TN-GO366-2026';if(np&&v){o.night=np;o.nightAmt=fare(v,km)-fare0(v,km)}return o} // prices saved in the booking for the final bill
async function cloudBook(){if(blockedStop())return;
  {const ar=localArea();if(ar.far&&!(ar.autoOk&&autoOnly()&&S.veh==='auto'))return areaAsk(ar)}
  const r=route(S.from,S.dest),v=VEH.find(x=>x.id===S.veh),f=fare(v,r.km);
  if(S.pay==='wallet')S.pay='upi';
  const btn=document.getElementById('bookb');if(btn){btn.disabled=true;btn.textContent=L('Book ஆகுது…','Booking…')}
  const pin=String(1000+Math.floor(Math.random()*9000));
  const trip=(r.pts||r.path.map(k=>P[k])).map(p=>({lat:p.lat,lon:p.lon}));
  const data={customerUid:CUID,custName:S.name,custPhone:'+91'+S.phone,src:'app',kind:'ride',from:placeOf(S.from),to:placeOf(S.dest),path:trip,
    veh:v.id,vehTa:v.ta,vehEn:v.en,km:+r.km.toFixed(1),base:v.base,fare:f,pay:S.pay,status:'searching',when:VCTCLK.now(),rider:S.rider||null,tip:S.tip0||0,tariff:localTar(v,r.km),
    createdAt:F().serverTimestamp(),updatedAt:F().serverTimestamp()};
  try{
    if(!CFG.serverPin)try{Object.assign(data,await VCTPIN.fields(pin))}catch(e){} // lets the driver check the PIN even if this phone goes offline
    const ct=takeContact(data);
    const ref=await F().addDoc(F().collection(CL.db,'bookings'),data);
    await F().setDoc(F().doc(CL.db,'bookings',ref.id,'private','pin'),{pin});
    await saveContact(ref.id,ct);
    R={id:ref.id,v,km:r.km,path:r.path,fare:f,pay:S.pay,from:S.from,dest:S.dest,fromName:{ta:P[S.from].ta,en:P[S.from].en},destName:{ta:P[S.dest].ta,en:P[S.dest].en},
       pin,trackId:ref.id.slice(0,8),trip,phase:'search',chat:[],drv:null,dpos:null,b:data,riderPh:ct.riderPhone,t0:Date.now(),boost:S.tip0||0};S.tip0=0;
    rememberRide();watchBooking();
  }catch(e){if(e&&e.code==='permission-denied'&&!MEBLK){F().getDoc(F().doc(CL.db,'blocked','+91'+S.phone)).then(x=>{if(x.exists()){MEBLK=true;blockedStop()}}).catch(()=>{})}
    toast(CL.errText(e,S.lang==='ta'));if(btn){btn.disabled=false;fareScreen()}}
}

    ()=>{LIVEUNSUB=null;setTimeout(()=>{if(!LIVEUNSUB&&R&&R.b&&R.b.driverPhone===ph&&['assigned','arrived','ontrip'].includes(R.b.status))watchDrv(ph)},8000)});

function onBooking(b){
  R.b=b;if(b.status!=='done')R.boost=+b.tip||0;
  if(b.driverPhone&&!LIVEUNSUB){
    R.drv={ta:b.driverName||'Driver',en:b.driverName||'Driver',plate:b.plate||'',model:b.vehModel||'',rating:'',trips:0,phone:b.driverPhone};
    watchDrv(b.driverPhone);
  }
  if(b.status==='searching'){if(R.phase!=='search'||!document.getElementById('cxs'))searchingCloud();return}
  if(b.status==='assigned'||b.status==='ontrip'){
    chatStart(R.id);
    if(!CFG.serverPin&&b.status==='assigned'&&b.pinTry&&b.pinTry!==R.lastTry){ // with the server PIN check, a PIN typed into the booking is never confirmed here
R.lastTry=b.pinTry;
      if(b.pinTry===R.pin){F().updateDoc(F().doc(CL.db,'bookings',R.id),{status:'ontrip',startedAt:F().serverTimestamp(),updatedAt:F().serverTimestamp()}).catch(()=>{});toast(L('PIN சரி! பயணம் ஆரம்பம்','PIN verified. Your trip has started'))}
      else toast(L('Driver போட்ட PIN தப்பு. உங்க PIN-ஐ மறுபடி சொல்லுங்க','The driver entered a wrong PIN. Tell them your PIN again'))}
    if(R.phase!=='ride'||!document.getElementById('stB'))rideCloud();else rideCloudUpdate(true);
    return;
  }
  if(b.status==='done'){stopWatch();forgetRide();R.fare=FARE.billOf(b);R.fx=b.fx||null;R.boost=+b.tip||0;R.pay=b.pay||R.pay;doneScreen();return}
  if(b.status==='cancelled'&&!R.selfCancel&&/^driver/.test(b.cancelReason||'')&&!b.startedAt&&!OFK.includes(b.kind)&&(R.rebookN||0)<3){autoRebook(b);return}
  if(b.status==='cancelled'){stopWatch();forgetRide();if(!R.selfCancel){if(b.cancelReason&&b.cancelReason!=='customer'&&!/^(driver|noshow|custask)/.test(b.cancelReason))setTimeout(()=>sorrySheet(b.cancelReason),400);else toast(L('இந்த ride ரத்து ஆயிடுச்சு. மறுபடி book பண்ணுங்க','This ride was cancelled. Please book again'));recordTrip('cancelled',{reason:b.cancelReason||''})}R=null;home()}
}

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
/* Android app: push only through the native FCM build (VCTPush marker); web push never works inside the app's WebView */
const NATIVEC=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const pushReadyC=()=>!!(CL&&CFG.push&&CFG.push.vapid&&(NATIVEC()?(CL.nativePush&&CL.nativePush()):('Notification' in window&&'serviceWorker' in navigator)));
async function enablePushC(ask){if(!pushReadyC()||!CUID)return false;
  const NAT=CL.nativePush&&CL.nativePush();
  if(!NAT&&Notification.permission!=='granted'){if(!ask)return false;if(await Notification.requestPermission()!=='granted'){toast(L('Notification அனுமதி கொடுக்கல','Notifications not allowed'));return false}}
  if(NAT&&!ask)return false;
  const t=NAT?await CL.nativePushToken():await CL.pushToken(CFG.push.vapid,'./fcm-sw.js','./fcm/');if(!t){if(ask)toast(L('இந்த phone-ல notification வேலை செய்யாது','Notifications are not supported on this phone'));return false}
  let old='',ol='';try{old=localStorage.getItem('vct_cfcm')||'';ol=localStorage.getItem('vct_cfcml')||''}catch(e){}
  if(t!==old||S.lang!==ol){await F().setDoc(F().doc(CL.db,'users',CUID),{fcm:t,lang:S.lang==='en'?'en':'ta',fcmAt:F().serverTimestamp()},{merge:true}).catch(()=>{});try{localStorage.setItem('vct_cfcm',t);localStorage.setItem('vct_cfcml',S.lang)}catch(e){}}

function locateMe(force,cb){
  if(!REALMAP||!navigator.geolocation)return;if((GOTPOS||LOCATING)&&!force)return;LOCATING=true;
  if(GEOWATCH!=null)navigator.geolocation.clearWatch(GEOWATCH);
  let best=null,done=false,first=true;
  const finish=()=>{if(done)return;done=true;LOCATING=false;clearTimeout(tmo);if(GEOWATCH!=null){navigator.geolocation.clearWatch(GEOWATCH);GEOWATCH=null}
    if(!best){if(force)toast(L('Location கிடைக்கல. GPS on பண்ணுங்க, அல்லது map-ல pin பண்ணுங்க','Could not get your location. Turn on GPS, or pin your pickup on the map'));return}
    revGeo(best.lat,best.lon).then(g=>{if(g){P.home.ta=g.ta;P.home.en=g.en;P.home.sub=g.sub;P.home.addr=g.addr||''}if(document.getElementById('wh'))home()})};
  const tmo=setTimeout(finish,15000);
  GEOWATCH=navigator.geolocation.watchPosition(p=>{
      const c={lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)};
      if(!best||c.acc<best.acc){best=c;GOTPOS=true;Object.assign(P.home,{lat:c.lat,lon:c.lon,acc:c.acc});if(!P.home.sub){P.home.ta='உங்க இடம்';P.home.en='Your location'}
        if(first){first=false;cb&&cb();if(!cb&&document.getElementById('wh'))home()}}
      if(c.acc&&c.acc<=15)finish()},
    ()=>{if(!best)finish()},{enableHighAccuracy:true,timeout:15000,maximumAge:0});
}
function geoName(k,c){if(c&&c.g){P[k].ta=c.g.ta;P[k].en=c.g.en;P[k].sub=c.g.sub;P[k].addr=c.g.addr||''}}
/* name+address must be ready before it is saved: wait a little, else fill it in later (coordinates are never touched) */
async function geoConfirm(k,c){
  if(!REALMAP)return;if(!c.g){const g=await revGeoWait(c.lat,c.lon,4000);if(g)c.g=g}
  if(c.g&&P[k]&&P[k].lat===c.lat&&P[k].lon===c.lon){geoName(k,c);return}
  revGeo(c.lat,c.lon).then(g=>{if(g&&P[k]&&P[k].lat===c.lat&&P[k].lon===c.lon){c.g=g;geoName(k,c)}})}
function liveSearch(q){
  clearTimeout(SRT);q=(q||'').trim();const old=document.getElementById('osr');if(q.length<3){if(old)old.remove();return}
  SRT=setTimeout(async()=>{
    let rows=null,src='Photon · © OpenStreetMap';
    try{
      if(GMAP()){try{rows=await gSuggest(q,P[S.from],S.mode==='out'?250000:30000);src='powered by Google'}catch(e){rows=null}}
      if(!rows){const r=await fetch(`${MAPCFG.search}?q=${encodeURIComponent(q)}&lat=12.93&lon=79.14&limit=7${S.mode==='out'?'':'&bbox=78.6,12.6,79.6,13.3'}`);const j=await r.json();
        rows=(j.features||[]).map(f=>{const pr=f.properties||{},c=f.geometry.coordinates;const name=pr.name||(pr.housenumber&&pr.street?pr.housenumber+', '+pr.street:pr.street)||'';
          const sub=[pr.street&&pr.street!==name?pr.street:'',pr.district||pr.locality||'',pr.city||pr.county||''].filter(Boolean).join(', ');return{name,sub,lat:c[1],lon:c[0]}}).filter(x=>x.name)}
    }catch(e){rows=rows||[]}
    const ls=document.getElementById('ls'),dr=document.getElementById('dr');if(!ls||!dr||dr.value.trim()!==q)return;
    let box=document.getElementById('osr');if(!box){box=document.createElement('div');box.id='osr';ls.insertBefore(box,ls.children[1]||null)}
    box.innerHTML=rows.length?`<div class="tagline">${L('வரைபடத்தில் கிடைத்தவை','Places on the map')}</div>`+rows.map((x,i)=>`<button class="row" data-g="${i}"><span class="ic">${I.pin}</span><div><b>${esc(x.name)}</b><small>${esc(x.sub)}${x.lat!=null?' · '+(hav(P[S.from],x)*1.35).toFixed(1)+' '+t('km'):''}</small></div></button>`).join('')+`<p class="fine muted" style="margin:4px 0 0;text-align:left">${src}</p>`:'';
    box.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const x=rows[+b.dataset.g];
      const go2=c=>{setCustom('drop',c);P.drop.ta=P.drop.en=x.name;P.drop.sub=x.sub;P.drop.addr=[x.name,x.sub].filter(Boolean).join(', ');S.dest='drop';fareScreen()};
      if(x.pred)gPick(x).then(go2).catch(()=>toast(L('இந்த இடத்தை எடுக்க முடியல. Map-ல pin பண்ணுங்க','Could not open that place. Pin it on the map')));else go2({lat:x.lat,lon:x.lon})});
  },400);
}
